  function startMeasure(root) {
    measuring = { until: null, levels: [] };
    const btn = $(root, '#cMeasure');
    btn.disabled = true;
    btn.textContent = 'Measuring... stay quiet';
  }

  function finishMeasure(root) {
    const floor = Math.max(-90, median(measuring.levels)); // digital silence would read -180 dB
    measuring = null;
    const res = Store.setSettings({ noiseFloorDb: Math.round(floor * 10) / 10 });
    $(root, '#cFloor').textContent = floor.toFixed(1) + ' dB' + (res.ok ? '' : ' (could not save!)');
    const btn = $(root, '#cMeasure');
    btn.disabled = false;
    btn.textContent = 'Measure again (3 s)';
  }

  function startRecording(root) {
    const sr = AudioEngine.sampleRate();
    const label = $(root, '#cRecLabel').value;
    $(root, '#cRec').disabled = true;
    recording = { label: label, source: $(root, '#cRecSource').value, need: Math.round(REC_SECONDS * sr), chunks: [], got: 0 };
    $(root, '#cRecStatus').textContent = 'Recording ' + label + '... strum now';
    const off = AudioEngine.onChunk(function (chunk) {
      if (!recording) { off(); return; }
      recording.chunks.push(chunk);
      recording.got += chunk.length;
      if (recording.got >= recording.need) { off(); finishRecording(root, sr); }
    });
    offs = offs.concat([off]);
  }

  function timestamp() {
    const d = new Date();
    const p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function finishRecording(root, sr) {
    const rec = recording;
    recording = null;
    const samples = new Float32Array(rec.need);
    let pos = 0, peak = 0;
    rec.chunks.forEach(function (c) { const n = Math.min(c.length, rec.need - pos); samples.set(c.subarray(0, n), pos); pos += n; });
    for (let i = 0; i < samples.length; i++) peak = Math.max(peak, Math.abs(samples[i]));
    const name = rec.label + '_' + rec.source + '_' + timestamp() + '.wav';
    const url = URL.createObjectURL(new Blob([DSP.encodeWav(samples, sr)], { type: 'audio/wav' }));
    recordedTakes = recordedTakes.concat([{ name: name, url: url }]);
    const pk = DSP.toDb(peak);
    $(root, '#cRecStatus').innerHTML = 'Saved ' + esc(name) + ' - peak ' + pk.toFixed(1) + ' dBFS' +
      (pk >= CLIP_DB ? ' <span class="pill bad">clipped, turn down</span>' : pk < -35 ? ' <span class="pill warn">quiet, move closer</span>' : '');
    renderTakes(root);
    $(root, '#cRec').disabled = false;
  }

  function renderTakes(root) {
    $(root, '#cRecList').innerHTML = recordedTakes.map(function (r) {
      return '<a class="btn" download="' + esc(r.name) + '" href="' + r.url + '">' + esc(r.name) + '</a>';
    }).join('');
  }

  function topList(ranked) {
    return ranked.slice(0, 3).map(function (r) { return esc(r.id) + ' ' + r.score.toFixed(3); }).join('<br>');
  }

  function updateLevel(root, frame, t, meta) {
    peakDb = Math.max(meta.peakDb, peakDb - 0.4);   // sample peak with slow fall-back
    if (meta.peakDb >= CLIP_DB) clipUntil = t + 2;
    const clip = $(root, '#cClip');
    const inBand = peakDb >= STRUM_TARGET.lo && peakDb <= STRUM_TARGET.hi;
    const hot = peakDb > STRUM_TARGET.hi;
    clip.textContent = t < clipUntil ? 'CLIP' : inBand ? 'good level' : hot ? 'hot' : 'no clip';
    clip.className = 'pill' + (t < clipUntil ? ' bad' : inBand ? ' ok' : hot ? ' warn' : '');
    $(root, '#cPeakVal').textContent = peakDb < METER_FLOOR_DB ? '< ' + METER_FLOOR_DB : peakDb.toFixed(1);
    $(root, '#cFill').style.width = dbToPct(frame.levelDb) + '%';
    $(root, '#cPeak').style.left = dbToPct(peakDb) + '%';
    $(root, '#cGate').style.left = dbToPct(AudioEngine.gateDb()) + '%';
    $(root, '#cLevel').textContent = frame.levelDb < -90 ? '< -90' : frame.levelDb.toFixed(1);
    $(root, '#cCost').textContent = AudioEngine.info().costMs.toFixed(1);
    if (measuring) {
      if (measuring.until === null) measuring.until = t + 3;
      measuring.levels.push(frame.levelDb);
      if (t >= measuring.until) finishMeasure(root);
    }
  }

  function updateNote(root, frame, t) {
    const n = noteTrack(DSP.noteLabel(frame), frame, t);
    if (n.latency !== null) latNote = n.latency;
    const p = frame.pitch;
    $(root, '#cNote').innerHTML = p ? prettyNote(p.name) : '-';
    $(root, '#cNoteInfo').innerHTML = p
      ? (p.cents >= 0 ? '+' : '') + p.cents.toFixed(0) + ' c<br>' + p.freq.toFixed(1) + ' Hz<br>clarity ' + p.clarity.toFixed(2)
      : '&nbsp;';
    $(root, '#cLatNote').textContent = fmtMs(latNote);
  }

  function updateChord(root, frame, t) {
    const lib = libTrack(DSP.chordLabel(frame, 'verify'), frame, t);
    const all = idTrack(DSP.chordLabel(frame, 'identify'), frame, t);
    if (lib.latency !== null) latChord = lib.latency;
    $(root, '#cLatChord').textContent = fmtMs(latChord);
    $(root, '#cChord').textContent = lib.state.confirmed || '-';
    $(root, '#cChordAll').textContent = all.state.confirmed || '-';
    const verdict = $(root, '#cVerdict');
    const expected = $(root, '#cExpect').value;
    if (lib.state.confirmed === expected) { verdict.textContent = 'PASS: ' + expected; verdict.className = 'pill ok'; }
    else if (lib.state.confirmed) { verdict.textContent = 'heard ' + lib.state.confirmed; verdict.className = 'pill bad'; }
    else { verdict.textContent = 'listening...'; verdict.className = 'pill'; }
    if (!frame.chroma) return;
    const max = Math.max.apply(null, Array.prototype.slice.call(frame.chroma)) || 1;
    Array.prototype.forEach.call($(root, '#cChroma').children, function (bar, i) {
      bar.style.height = (frame.chroma[i] / max * 100) + '%';
    });
    $(root, '#cLib').innerHTML = topList(frame.lib);
    $(root, '#cAll').innerHTML = topList(frame.all);
    $(root, '#cLead').textContent = (frame.lib[0].score - frame.lib[1].score).toFixed(3);
  }

  return {
    title: 'Calibration',
    mount: function (root) {
      micGate(root, function () {
        noteTrack = makeConfirmTracker(DSP.CONFIG.noteStableSec);
        libTrack = makeConfirmTracker(DSP.CONFIG.chordStableSec);
        idTrack = makeConfirmTracker(DSP.CONFIG.chordStableSec);
        view(root);
        AudioEngine.setAnalysis({ pitch: true, chords: true });
        WakeLock.acquire();
        offs = offs.concat([AudioEngine.onFrame(function (fr, t, meta) {
          updateLevel(root, fr, t, meta);
          updateNote(root, fr, t);
          updateChord(root, fr, t);
        })]);
      });
    },
    leave: function () {
      offs.forEach(function (f) { f(); });
      offs = [];
      recording = null;
      WakeLock.release();
    }
  };
}

// ---------- router ----------
// health: defined in the health-ui script below, resolved when the route is opened
const SCREENS = { home: HomeScreen, tuner: TunerScreen, calibrate: CalibrateScreen, health: function () { return HealthScreen(); } };
let currentScreen = null;

function route() {
  const name = location.hash.replace('#', '') || 'home';
  const factory = SCREENS[name] || SCREENS.home;
  if (currentScreen && currentScreen.leave) currentScreen.leave();
  currentScreen = factory();
  document.getElementById('title').textContent = currentScreen.title;
  document.getElementById('backBtn').hidden = factory === HomeScreen;
  app.innerHTML = '';
  window.scrollTo(0, 0);
  currentScreen.mount(app);
}

document.getElementById('backBtn').addEventListener('click', function () { location.hash = '#home'; });
AudioEngine.onState(function (on) {
  const pill = document.getElementById('micPill');
  pill.textContent = on ? 'mic on' : 'mic off';
  pill.className = 'pill' + (on ? ' ok' : '');
});
window.addEventListener('hashchange', route);
window.addEventListener('error', function (e) { console.error('Unexpected error:', e.error || e.message); });
document.addEventListener('DOMContentLoaded', route);   // after all screen scripts have loaded
</script>

<!-- ===================== HEALTH UI: guided Guitar Health Check ===================== -->
<script id="health-ui">
'use strict';
// ===== Guitar Health Check (wizard). Pure analysis lives in health-core (GuitarHealth). =====
const HC = GuitarHealth;
const HC_STRING_LABELS = ['6 (low E)', '5 (A)', '4 (D)', '3 (G)', '2 (B)', '1 (high e)'];
const HC_CAPTURE_SEC = 2.2, HC_PREROLL_SEC = 0.15, HC_TIMEOUT_SEC = 12;
const HC_STABILITY_MIN = 10;
const HC_MAX_SPREAD = 5;   // cents; a clean sustained pluck measures well under 1 c, a disturbed one 8+ c
const HC_DEFAULT_GUITAR = 'Epiphone Les Paul (Tune-o-matic bridge)';
const HC_PHOTOS = ['Front of the guitar', 'Bridge from above', 'Bridge side view, with a ruler', '12th fret side view, ruler on the low E string',
  '12th fret side view, ruler on the high e string', 'Nut close-up', 'Pickups side view, with a ruler', 'First frets close-up',
  'Headstock and tuners', 'Strings close-up'];
const HC_VOICINGS = Object.freeze({   // low E -> high e, null = not played (pinky-free shapes)
  C: [null, 3, 2, 0, 1, 0], G: [3, 2, 0, 0, 0, 3], A: [null, 0, 2, 2, 2, 0], D: [null, null, 0, 2, 3, 2], E: [0, 2, 2, 1, 0, 0]
});
const HC_CHECKS = [
  { id: 'manual', title: 'Manual checklist', sub: 'strings, relief, action, pickups (do this first)' },
  { id: 'stability', title: 'Tuning stability', sub: 'snapshot now, re-measure after ' + HC_STABILITY_MIN + ' min of playing' },
  { id: 'nut', title: 'Nut height', sub: 'open vs 1st fret, per string' },
  { id: 'intonation', title: 'Intonation', sub: 'open/harmonic vs 12th fret, with fix loop' },
  { id: 'sweep', title: 'Fret sweep', sub: 'frets 1-12, dead notes, buzz, heatmap' },
  { id: 'pressure', title: 'Fretting pressure', sub: 'hold a chord, pluck each string' },
  { id: 'balance', title: 'String balance', sub: 'open strings, even picking (low confidence)' }
];

function hcOpenMidi(s) { return DSP.STRINGS[s].midi; }
function hcCents(c) { return c === null || c === undefined ? '-' : HC.fmtCents(c); }

// Compact, storable subset of an analyzeNote result.
function hcCompact(m) {
  if (!m) return null;
  const keep = ['found', 'reason', 'freq', 'midi', 'name', 'cents', 'matches', 'spreadCents', 'peakDb', 'decaySec', 'decayCapped', 'noise', 'userBuzz'];
  const out = {};
  keep.forEach(function (k) { if (m[k] !== undefined) out[k] = typeof m[k] === 'number' ? Math.round(m[k] * 1000) / 1000 : m[k]; });
  return out;
}

// ---------- draft persistence (immutable updates) ----------
function hcEmptyDraft() {
  return {
    startedAt: Date.now(), manual: {}, intonation: [null, null, null, null, null, null], intonationRef: 'open',
    nut: [null, null, null, null, null, null],
    sweep: DSP.STRINGS.map(function () { return new Array(12).fill(null); }),
    stability: { before: null, beforeAt: null, after: null, afterAt: null },
    pressure: { chord: 'C', notes: [null, null, null, null, null, null] },
    balance: [null, null, null, null, null, null]
  };
}
function hcDraft() { return Store.load().healthDraft || hcEmptyDraft(); }
function hcSaveDraft(fn) {
  const res = Store.update(function (s) { return Object.assign({}, s, { healthDraft: fn(s.healthDraft || hcEmptyDraft()) }); });
  if (!res.ok) hcSaveError();
  return res;
}
function hcSaveError() {
  const main = document.getElementById('app');
  if (main.querySelector('.hc-save-error')) return;
  const p = document.createElement('p');
  p.className = 'status err hc-save-error';
  p.textContent = 'Could not save this measurement (browser storage full or blocked, e.g. private mode). Export a backup and free space.';
  main.prepend(p);
}
function hcSetIn(arr, i, v) { return arr.map(function (x, j) { return j === i ? v : x; }); }

function hcMeta() {
  const info = AudioEngine.info();
  return { guitar: hcDraft().manual.guitar || HC_DEFAULT_GUITAR, input: info.inputLabel || 'default input', sampleRate: info.sampleRate };
}

// Draft -> report object understood by GuitarHealth.summarize / compare.
function hcBuildReport(d) {
  const r = {};
  if (d.intonation.some(Boolean)) r.intonation = d.intonation.map(function (x, s) { return x && x.ref && x.fretted ? HC.intonation(s, x.ref, x.fretted, x.refKind) : null; });
  if (d.nut.some(Boolean)) r.nut = HC.nut(d.nut);
  if (d.sweep.some(function (row) { return row.some(Boolean); })) r.sweep = HC.sweep(d.sweep);
  if (d.stability.before && d.stability.after) {
    r.stability = HC.stability(d.stability.before, d.stability.after, (d.stability.afterAt - d.stability.beforeAt) / 60000);
  }
  const pv = HC_VOICINGS[d.pressure.chord];
  if (d.pressure.notes.some(Boolean)) {
    r.pressure = HC.pressure(d.pressure.notes.map(function (m, s) { return m ? { fretted: pv[s] > 0, m: m } : null; }), hcOpenRefs(d));
  }
  if (d.balance.filter(function (x) { return x !== null; }).length) r.balance = HC.balance(d.balance);
  if (Object.keys(d.manual).length) r.manual = d.manual;
  return r;
}

// Latest open-string measurements (to remove tuning offsets in the pressure check).
function hcOpenRefs(d) {
  return DSP.STRINGS.map(function (_, s) {
    if (d.stability.after && d.stability.after[s]) return d.stability.after[s];
    if (d.stability.before && d.stability.before[s]) return d.stability.before[s];
    if (d.nut[s] && d.nut[s].open) return d.nut[s].open;
    if (d.intonation[s] && d.intonation[s].refKind === 'open') return d.intonation[s].ref;
    return null;
  });
}

// ---------- capture one plucked note from the dry input ----------
// Resolves with an analyzeNote result (found:false on timeout/cancel). cancel() via returned handle.
function hcCapture(expectedMidi, onState) {
  let off = null, timer = null, settled = false, resolveFn;
  const sr = AudioEngine.sampleRate();
  const pre = [], post = [];
  let preLen = 0, postLen = 0, triggered = false, onsetIdx = 0;
  const recentDb = [];                        // chunk levels of the last ~150 ms
  const preMax = Math.round(HC_PREROLL_SEC * sr), need = Math.round(HC_CAPTURE_SEC * sr);
  const finish = function (result) {
    if (settled) return;
    settled = true;
    if (off) off();
    clearTimeout(timer);
    resolveFn(result);
  };
  const promise = new Promise(function (resolve) {
    resolveFn = resolve;
    onState('listening');
    off = AudioEngine.onChunk(function (chunk) {
      if (!triggered) {
        pre.push(chunk); preLen += chunk.length;
        while (preLen - pre[0].length >= preMax) preLen -= pre.shift().length;
        // a NEW attack: above the gate and >= 6 dB above the recent minimum (a still-ringing note never rises)
        const db = DSP.toDb(DSP.rms(chunk));
        const history = recentDb.length >= 3;      // no trigger until the recent level is known (else a ringing tail triggers)
        const floor = history ? Math.min.apply(null, recentDb) : db;
        recentDb.push(db);
        if (recentDb.length > Math.ceil(0.15 * sr / chunk.length)) recentDb.shift();
        if (history && db > AudioEngine.gateDb() && db - floor >= DSP.CONFIG.onsetRiseDb) {
          triggered = true;
          onsetIdx = preLen - chunk.length;
          onState('recording');
        }
        return;
      }
      post.push(chunk); postLen += chunk.length;
      if (postLen >= need) {
        const all = new Float32Array(preLen + postLen);
        let o = 0;
        pre.concat(post).forEach(function (c) { all.set(c, o); o += c.length; });
        onState('analysing');
        setTimeout(function () {
          try { finish(HC.analyzeNote(all, sr, AudioEngine.gateDb(), expectedMidi, onsetIdx / sr)); }
          catch (e) { console.error('Note analysis failed:', e); finish({ found: false, reason: 'analysis error' }); }
        }, 0);
      }
    });
    timer = setTimeout(function () { finish({ found: false, reason: 'nothing heard in ' + HC_TIMEOUT_SEC + ' s' }); }, HC_TIMEOUT_SEC * 1000);
  });
  return { promise: promise, cancel: function () { finish({ found: false, reason: 'cancelled' }); } };
}

function hcDescribe(m, expectedMidi) {
  if (!m.found) return '<span class="pill bad">' + esc(m.reason || 'not heard') + '</span>';
  const wrong = expectedMidi !== undefined && !m.matches;
  return (wrong ? '<span class="pill bad">heard ' + esc(m.name) + ', expected ' + esc(DSP.noteName(expectedMidi)) + '</span> '
    : '<span class="pill ok">' + esc(m.name) + '</span> ') +
    '<span class="mono">' + hcCents(m.cents) + '</span>' +
    (m.spreadCents > 3 ? ' <span class="pill warn">unsteady</span>' : '');
}

// ---------- screen ----------
function HealthScreen() {
  let root = null, view = { name: 'menu' }, capture = null, tick = null, gen = 0;

  function go(v) { stopCapture(); clearInterval(tick); view = v; render(); }

  // Every render bumps `gen`; an async measurement started under an older render must stop (stale view/position).
  function stale(my) { return my !== gen || !root || !root.isConnected; }

  // While a measurement loop runs, its action buttons are disabled (navigation stays enabled to cancel).
  function busy(on) {
    Array.prototype.forEach.call(root.querySelectorAll('button:not([data-go]), select'), function (b) { b.disabled = on; });
  }
  function stopCapture() { if (capture) { capture.cancel(); capture = null; } }

  // Runs one capture, updates #hcStatus, resolves with the measurement (compact).
  function listen(expectedMidi, prompt) {
    stopCapture();
    const status = $(root, '#hcStatus');
    const setState = function (st) {
      if (!status) return;
      status.innerHTML = st === 'listening' ? '<span class="pill warn">listening...</span> ' + esc(prompt)
        : st === 'recording' ? '<span class="pill ok">recording - let it ring</span>' : '<span class="pill">analysing...</span>';
    };
    capture = hcCapture(expectedMidi, setState);
    return capture.promise.then(function (m) {
      capture = null;
      if (status) status.innerHTML = hcDescribe(m, expectedMidi);
      return hcCompact(m);
    });
  }

  // Like listen(), but asks again (up to 3 tries) when nothing or the wrong note was heard.
  // Returns the measurement, or null after 3 failed tries / when the view changed (callers check stale()).
  async function listenRetry(expectedMidi, prompt, my) {
    let hint = '';
    for (let attempt = 1; attempt <= 3; attempt++) {
      const m = await listen(expectedMidi, hint ? hint + ' - ' + prompt : prompt);
      if (stale(my)) return null;
      if (m && m.found && m.matches && m.spreadCents <= HC_MAX_SPREAD) return m;
      hint = m && m.found && !m.matches ? 'heard ' + m.name + ', expected ' + DSP.noteName(expectedMidi) + ', play it again'
        : m && m.found ? 'pitch was unsteady, let it ring without touching other strings, play it again'
          : 'did not hear it clearly, play it again';
    }
    return null;
  }

  function header(title, intro) {
    return '<p><button class="back" data-go="menu">&larr; All checks</button></p><h2>' + esc(title) + '</h2>' +
      (intro ? '<p class="small muted">' + intro + '</p>' : '');
  }

  function wire() {
    Array.prototype.forEach.call(root.querySelectorAll('[data-go]'), function (b) {
      b.addEventListener('click', function () { go({ name: b.getAttribute('data-go') }); });
    });
  }

  function render() {
    gen++;
    clearInterval(tick);
    const fn = { menu: renderMenu, manual: renderManual, stability: renderStability, nut: renderNut, intonation: renderIntonation,
      sweep: renderSweep, pressure: renderPressure, balance: renderBalance, summary: renderSummary, history: renderHistory }[view.name];
    fn();
    wire();
  }

  // ----- menu -----
  function checkDone(d, id) {
    if (id === 'manual') return Object.keys(d.manual).length > 0;
    if (id === 'stability') return !!d.stability.after;
    if (id === 'nut') return d.nut.filter(Boolean).length;
    if (id === 'intonation') return d.intonation.filter(Boolean).length;
    if (id === 'sweep') return d.sweep.reduce(function (a, r) { return a + r.filter(function (m) { return m && !m.skipped; }).length; }, 0);
    if (id === 'pressure') return d.pressure.notes.filter(Boolean).length;
    if (id === 'balance') return d.balance.filter(function (x) { return x !== null; }).length;
    return 0;
  }

  function renderMenu() {
    const d = hcDraft();
    const reports = Store.load().healthReports || [];
    root.innerHTML =
      '<p class="small muted">Use the iRig. Tune the guitar first. Results are kept until you save the report, so you can do the checks ' +
      'in several sittings. Suggested order: top to bottom (set relief and action before intonation).</p>' +
      '<div class="panel small">Draft started ' + esc(new Date(d.startedAt).toLocaleString()) +
      ' <button class="back" id="hcReset">Start a new draft</button></div>' +
      '<div class="tiles">' + HC_CHECKS.map(function (c) {
        const n = checkDone(d, c.id);
        return '<button class="tile" data-go="' + c.id + '">' + esc(c.title) + '<span class="sub">' + esc(c.sub) + '</span>' +
          '<span class="pill' + (n ? ' ok' : '') + '">' + (n ? (n === true ? 'done' : n + ' measured') : 'not done') + '</span></button>';
      }).join('') + '</div>' +
      '<p style="margin-top:16px"><button class="primary block" data-go="summary">Summary report</button></p>' +
      '<p><button class="block" data-go="history">History (' + reports.length + ' saved)</button></p>';
    $(root, '#hcReset').addEventListener('click', function () {
      if (!confirmInline(this, 'Tap again to discard the current draft')) return;
      hcSaveDraft(function () { return hcEmptyDraft(); });
      render();
    });
  }

  // Two-tap confirmation without browser dialogs.
  function confirmInline(btn, text) {
    if (btn.getAttribute('data-armed')) return true;
    btn.setAttribute('data-armed', '1');
    btn.textContent = text;
    return false;
  }

  // ----- manual checklist -----
  function renderManual() {
    const m = hcDraft().manual, S = HC.MANUAL_SPEC;
    const field = function (key, label, how, unit) {
      return '<div class="panel"><b>' + label + '</b><p class="small muted">' + how + '</p>' +
        '<div class="row"><input class="num" type="number" inputmode="decimal" step="0.05" min="0" id="m_' + key + '" value="' +
        esc(m[key] === undefined ? '' : m[key]) + '"><span>' + unit + '</span></div></div>';
    };
    root.innerHTML = header('Manual checklist', 'No audio. Measure with a steel ruler and a feeler gauge (or a business card, about 0.25 mm). ' +
      'Typical values are factory starting points for a Les Paul-style guitar, not strict rules.') +
      '<div class="panel"><b>Guitar</b><div class="row"><input class="num grow" type="text" maxlength="80" id="m_guitar" value="' +
      esc(m.guitar === undefined ? HC_DEFAULT_GUITAR : m.guitar) + '"></div></div>' +
      field('stringAgeWeeks', 'String age', 'Weeks since the strings were changed. Old strings make intonation impossible to set: change them first if they are old.', 'weeks') +
      field('reliefMm', 'Neck relief', 'Capo at the 1st fret. Hold the low E down where the neck meets the body (around fret 16). ' +
        'Measure the gap between the bottom of the string and the top of the 7th fret. Typical ' + S.reliefMm.typical + '.', 'mm') +
      field('actionBassMm', 'Action at 12th fret, low E', 'In tune, no capo: from the top of the 12th fret to the bottom of the low E string. Typical ' + S.actionBassMm.typical + '.', 'mm') +
      field('actionTrebleMm', 'Action at 12th fret, high e', 'Same for the high e string. Typical ' + S.actionTrebleMm.typical + '.', 'mm') +
      field('pickupNeckMm', 'Neck pickup height (bass side)', 'Hold the low E at the last fret; measure from the bottom of the string to the top of the pole piece. Typical ' + S.pickupNeckMm.typical + '.', 'mm') +
      field('pickupBridgeMm', 'Bridge pickup height (bass side)', 'Same method, bridge pickup. Typical ' + S.pickupBridgeMm.typical + '.', 'mm') +
      '<button class="primary block" id="hcManualSave">Save checklist</button><p class="small" id="hcStatus">&nbsp;</p>';
    $(root, '#hcManualSave').addEventListener('click', function () {
      const keys = ['stringAgeWeeks', 'reliefMm', 'actionBassMm', 'actionTrebleMm', 'pickupNeckMm', 'pickupBridgeMm'];
      const vals = {};
      const g = $(root, '#m_guitar').value.trim().slice(0, 80);
      if (g) vals.guitar = g;
      keys.forEach(function (k) {
        const v = $(root, '#m_' + k).value.trim();
        if (v !== '' && !isNaN(Number(v)) && Number(v) >= 0) vals[k] = v;
      });
      const res = hcSaveDraft(function (d) { return Object.assign({}, d, { manual: vals }); });
      $(root, '#hcStatus').innerHTML = res.ok ? '<span class="pill ok">saved</span> ' + HC.manual(vals).map(function (f) {
        return esc(f.title); }).join('; ') : '<span class="pill bad">could not save</span>';
    });
  }

  // ----- generic per-string table + runner -----
  function stringTable(rows) {
    return '<table class="small"><tbody>' + rows.map(function (r) {
      return '<tr><td>' + esc(r[0]) + '</td>' + r.slice(1).map(function (c) { return '<td class="mono">' + c + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
  }

  function promptCard(id) { return '<div class="panel hc-prompt" id="' + id + '"></div><p class="small" id="hcStatus">&nbsp;</p>'; }

  function setPrompt(html) { const p = $(root, '.hc-prompt'); if (p) p.innerHTML = html; }

  // ----- stability -----
  function renderStability() {
    const d = hcDraft(), st = d.stability;
    const elapsed = st.beforeAt ? (Date.now() - st.beforeAt) / 60000 : 0;
    const res = st.before && st.after ? HC.stability(st.before, st.after, (st.afterAt - st.beforeAt) / 60000) : null;
    root.innerHTML = header('Tuning stability', 'Tune all six strings, take the snapshot, then play normally (bends included) for ' +
      HC_STABILITY_MIN + ' minutes and re-measure. You can leave this screen meanwhile.') +
      promptCard('hcPrompt') +
      '<div class="row"><button class="primary grow" id="hcSnap">' + (st.before ? 'Take snapshot again' : 'Take snapshot (6 open strings)') + '</button>' +
      '<button class="grow" id="hcAfter"' + (st.before ? '' : ' disabled') + '>Re-measure</button></div>' +
      '<p class="small" id="hcTimer"></p>' +
      stringTable(DSP.STRINGS.map(function (s, i) {
        const b = st.before && st.before[i], a = st.after && st.after[i];
        const r = res && res.rows[i];
        return [HC_STRING_LABELS[i], 'before ' + (b && b.found ? hcCents(b.cents) : '-'), 'after ' + (a && a.found ? hcCents(a.cents) : '-'),
          r ? '<b>' + hcCents(r.driftCents) + '</b>' : ''];
      })) + findingsHtml(res ? res.findings : []);
    const timer = $(root, '#hcTimer');
    const upd = function () {
      if (!st.beforeAt || st.after) { timer.textContent = ''; return; }
      const min = (Date.now() - st.beforeAt) / 60000;
      timer.textContent = min < HC_STABILITY_MIN ? 'Snapshot ' + min.toFixed(1) + ' min ago - play for ' + (HC_STABILITY_MIN - min).toFixed(1) + ' more min'
        : 'Ready to re-measure (' + min.toFixed(0) + ' min since snapshot)';
    };
    upd();
    tick = setInterval(upd, 5000);
    setPrompt(elapsed && !st.after ? 'Snapshot taken. Re-measure after playing.' : 'Ready.');
    $(root, '#hcSnap').addEventListener('click', function () { runOpenSet('before'); });
    $(root, '#hcAfter').addEventListener('click', function () { runOpenSet('after'); });
  }

  async function runOpenSet(which) {
    const my = gen, results = [];
    busy(true);
    for (let s = 0; s < 6; s++) {
      setPrompt('<div class="big-label">String ' + esc(HC_STRING_LABELS[s]) + '</div><p>Pluck it open once and let it ring.</p>');
      const m = await listenRetry(hcOpenMidi(s), 'pluck string ' + HC_STRING_LABELS[s] + ' open', my);
      if (stale(my)) return;
      results.push(m);
    }
    const now = Date.now();
    hcSaveDraft(function (d) {
      const st = which === 'before' ? { before: results, beforeAt: now, after: null, afterAt: null }
        : Object.assign({}, d.stability, { after: results, afterAt: now });
      return Object.assign({}, d, { stability: st });
    });
    render();
  }

  // ----- nut -----
  function renderNut() {
    const d = hcDraft();
    const res = HC.nut(d.nut);
    root.innerHTML = header('Nut height', 'Tune first. For each string: pluck it open, then fret the 1st fret with normal (light) pressure and pluck. ' +
      'If the nut slots are too high, 1st-fret notes come out sharp.') + promptCard('hcPrompt') +
      '<button class="primary block" id="hcRun">Measure all strings</button>' +
      stringTable(DSP.STRINGS.map(function (s, i) {
        const r = res.rows[i];
        return [HC_STRING_LABELS[i], r ? '1st fret ' + hcCents(r.sharpCents) : '-'];
      })) + findingsHtml(res.findings);
    setPrompt('Ready.');
    $(root, '#hcRun').addEventListener('click', async function () {
      const my = gen;
      busy(true);
      for (let s = 0; s < 6; s++) {
        setPrompt('<div class="big-label">String ' + esc(HC_STRING_LABELS[s]) + '</div><p>1) open</p>');
        const open = await listenRetry(hcOpenMidi(s), 'pluck open', my);
        if (stale(my)) return;
        setPrompt('<div class="big-label">String ' + esc(HC_STRING_LABELS[s]) + '</div><p>2) 1st fret, light pressure</p>');
        const fret1 = await listenRetry(hcOpenMidi(s) + 1, 'pluck at the 1st fret', my);
        if (stale(my)) return;
        const ok = open && open.found && fret1 && fret1.found && fret1.matches;
        hcSaveDraft(function (dd) { return Object.assign({}, dd, { nut: hcSetIn(dd.nut, s, ok ? { open: open, fret1: fret1 } : null) }); });
      }
      render();
    });
  }

  // ----- intonation -----
  function renderIntonation() {
    const d = hcDraft();
    const s = view.string === undefined ? 0 : view.string;
    const refKind = d.intonationRef;
    const rows = d.intonation.map(function (x, i) { return x && x.ref && x.fretted ? HC.intonation(i, x.ref, x.fretted, x.refKind) : null; });
    const cur = rows[s];
    root.innerHTML = header('Intonation', 'Fresh strings, relief and action set, guitar in tune. Compare the open string (or its 12th-fret harmonic) ' +
      'with the fretted 12th fret. OK within +-5 cents.') +
      '<div class="row"><select id="hcString" class="grow">' + HC_STRING_LABELS.map(function (l, i) {
        return '<option value="' + i + '"' + (i === s ? ' selected' : '') + '>String ' + l + '</option>'; }).join('') + '</select>' +
      '<select id="hcRef" class="grow"><option value="open"' + (refKind === 'open' ? ' selected' : '') + '>Reference: open string</option>' +
      '<option value="harmonic"' + (refKind === 'harmonic' ? ' selected' : '') + '>Reference: 12th-fret harmonic</option></select></div>' +
      promptCard('hcPrompt') +
      '<button class="primary block" id="hcRun">' + (cur ? 'Re-measure after adjusting' : 'Measure this string') + '</button>' +
      (cur ? '<div class="panel"><div class="big-label">' + hcCents(cur.offsetCents) + '</div><p><span class="pill ' +
        (cur.status === 'ok' ? 'ok' : 'bad') + '">' + cur.status + '</span> ' + esc(cur.advice) + '</p>' +
        (cur.status === 'ok' ? '' : '<p class="small muted">Loop: loosen the string slightly, move the saddle a little (quarter to half turn), ' +
          'retune the open string with the Tuner, then re-measure. Watch which way the saddle moves rather than the screw.</p>') +
        '<p class="small muted">open string tuning when measured: ' + hcCents(d.intonation[s].ref.cents) + '</p>' +
        (s < 5 ? '<button class="block" id="hcNext">Next string</button>' : '') + '</div>' : '') +
      stringTable(rows.map(function (r, i) {
        return [HC_STRING_LABELS[i], r ? hcCents(r.offsetCents) : '-', r ? '<span class="pill ' + (r.status === 'ok' ? 'ok' : 'bad') + '">' + r.status + '</span>' : '',
          r ? r.confidence : ''];
      })) + findingsHtml(HC.intonationFindings(rows));
    setPrompt('String ' + esc(HC_STRING_LABELS[s]) + ': ready.');
    $(root, '#hcString').addEventListener('change', function () { go({ name: 'intonation', string: Number(this.value) }); });
    $(root, '#hcRef').addEventListener('change', function () {
      const v = this.value;
      hcSaveDraft(function (dd) { return Object.assign({}, dd, { intonationRef: v }); });
    });
    const next = $(root, '#hcNext');
    if (next) next.addEventListener('click', function () { go({ name: 'intonation', string: s + 1 }); });
    $(root, '#hcRun').addEventListener('click', async function () {
      const my = gen, kind = hcDraft().intonationRef;
      busy(true);
      const open = hcOpenMidi(s);
      setPrompt('<div class="big-label">String ' + esc(HC_STRING_LABELS[s]) + '</div><p>1) ' +
        (kind === 'harmonic' ? 'touch the string lightly right above the 12th fret wire and pluck (harmonic)' : 'pluck the open string') + '</p>');
      const ref = await listenRetry(kind === 'harmonic' ? open + 12 : open, kind === 'harmonic' ? 'play the 12th-fret harmonic' : 'pluck open', my);
      if (stale(my)) return;
      if (!ref || !ref.found || !ref.matches) { busy(false); return; }
      setPrompt('<div class="big-label">String ' + esc(HC_STRING_LABELS[s]) + '</div><p>2) fret the 12th fret normally and pluck</p>');
      const fretted = await listenRetry(open + 12, 'pluck at the 12th fret', my);
      if (stale(my)) return;
      if (!fretted || !fretted.found || !fretted.matches) { busy(false); return; }
      hcSaveDraft(function (dd) { return Object.assign({}, dd, { intonation: hcSetIn(dd.intonation, s, { ref: ref, fretted: fretted, refKind: kind }) }); });
      go({ name: 'intonation', string: s });
    });
  }

  // ----- fret sweep -----
  function heatmap(cells, active) {
    const cw = 26, ch = 22, x0 = 34, y0 = 18;
    const colors = { ok: 'var(--ok)', buzz: 'var(--accent)', dead: '#9b7bd6', undetected: 'var(--bad)', skipped: '#4a5260', untested: '#2a313b' };
    const letters = { ok: '', buzz: 'B', dead: 'D', undetected: '?', skipped: '-' };
    let svg = '<svg viewBox="0 0 ' + (x0 + 12 * cw + 4) + ' ' + (y0 + 6 * ch + 4) + '" class="heatmap" role="img" aria-label="Fret sweep heatmap">';
    for (let f = 1; f <= 12; f++) svg += '<text x="' + (x0 + (f - 0.5) * cw) + '" y="12" class="hm-t">' + f + '</text>';
    for (let row = 0; row < 6; row++) {
      const s = 5 - row;                       // high e at the top, like tab
      svg += '<text x="4" y="' + (y0 + row * ch + 15) + '" class="hm-t" text-anchor="start">' + esc(DSP.STRINGS[s].name.replace(/\d/, '')) + '</text>';
      for (let f = 1; f <= 12; f++) {
        const c = cells && cells[s] && cells[s][f - 1];
        const st = c ? c.status : null;
        const isActive = active && active.s === s && active.f === f;
        svg += '<rect x="' + (x0 + (f - 1) * cw + 1) + '" y="' + (y0 + row * ch + 1) + '" width="' + (cw - 2) + '" height="' + (ch - 2) +
          '" rx="4" fill="' + (st ? colors[st] : '#2a313b') + '"' + (isActive ? ' stroke="#fff" stroke-width="2"' : '') + '/>';
        if (st && letters[st]) svg += '<text x="' + (x0 + (f - 0.5) * cw) + '" y="' + (y0 + row * ch + 15) + '" class="hm-l">' + letters[st] + '</text>';
      }
    }
    return svg + '</svg><p class="small muted">green ok &middot; B buzz (you marked) &middot; D short sustain &middot; ? not detected &middot; - skipped</p>';
  }

  function sweepCells(d) {
    // per-row statuses even if partially measured
    const res = HC.sweep(d.sweep.map(function (row) { return row.map(function (m) { return m; }); }));
    return { cells: d.sweep.map(function (row, s) { return row.map(function (m, f) { return m ? res.cells[s][f] : null; }); }), findings: res.findings };
  }

  function renderSweep() {
    const d = hcDraft();
    const pos = view.pos || { s: 0, f: 1 };
    const sc = sweepCells(d);
    root.innerHTML = header('Fret sweep', 'Each string, frets 1 to 12, one firm pluck each. After each note tap whether it was clean or buzzed ' +
      '(listen closely; buzz is often easier to hear acoustically). Dead notes and undetected notes are found automatically.') +
      heatmap(sc.cells, pos) + promptCard('hcPrompt') +
      '<div class="row"><button class="primary grow" id="hcGo">Listen</button><button class="grow" id="hcSkip">Skip</button></div>' +
      '<div class="row" style="margin-top:8px"><button class="ok grow" id="hcClean" disabled>Clean - next</button>' +
      '<button class="grow" id="hcBuzz" disabled style="background:var(--accent);color:#1a1205">It buzzed - next</button></div>' +
      '<div class="row" style="margin-top:8px"><select id="hcFrom" class="grow">' + HC_STRING_LABELS.map(function (l, i) {
        return '<option value="' + i + '"' + (i === pos.s ? ' selected' : '') + '>Start at string ' + l + '</option>'; }).join('') + '</select></div>' +
      findingsHtml(sc.findings);
    setPrompt('<div class="big-label">String ' + esc(HC_STRING_LABELS[pos.s]) + ', fret ' + pos.f + '</div>');
    let last = null;
    const advance = function () {
      const nf = pos.f < 12 ? { s: pos.s, f: pos.f + 1 } : pos.s < 5 ? { s: pos.s + 1, f: 1 } : null;
      go({ name: 'sweep', pos: nf || { s: 0, f: 1 }, auto: !!nf });
    };
    const store = function (m) {
      hcSaveDraft(function (dd) {
        return Object.assign({}, dd, { sweep: dd.sweep.map(function (row, s) { return s === pos.s ? hcSetIn(row, pos.f - 1, m) : row; }) });
      });
    };
    const listenNow = async function () {
      const my = gen;
      $(root, '#hcGo').disabled = true;
      const m = await listen(hcOpenMidi(pos.s) + pos.f, 'pluck string ' + HC_STRING_LABELS[pos.s] + ' at fret ' + pos.f);
      if (stale(my)) return;                    // skipped / moved on while listening: drop this result
      last = m;
      $(root, '#hcGo').disabled = false;
      $(root, '#hcGo').textContent = 'Redo';
      $(root, '#hcClean').disabled = false;
      $(root, '#hcBuzz').disabled = false;
    };
    $(root, '#hcGo').addEventListener('click', listenNow);
    $(root, '#hcSkip').addEventListener('click', function () { store({ skipped: true }); advance(); });
    $(root, '#hcClean').addEventListener('click', function () { store(Object.assign({}, last, { userBuzz: false })); advance(); });
    $(root, '#hcBuzz').addEventListener('click', function () { store(Object.assign({}, last, { userBuzz: true })); advance(); });
    $(root, '#hcFrom').addEventListener('change', function () { go({ name: 'sweep', pos: { s: Number(this.value), f: 1 } }); });
    if (view.auto) listenNow();                 // keep the flow going after each answer
  }

  // ----- pressure -----
  function renderPressure() {
    const d = hcDraft(), chord = d.pressure.chord, v = HC_VOICINGS[chord];
    const res = d.pressure.notes.some(Boolean)
      ? HC.pressure(d.pressure.notes.map(function (m, s) { return m ? { fretted: v[s] > 0, m: m } : null; }), hcOpenRefs(d)) : null;
    root.innerHTML = header('Fretting pressure', 'Hold the chord shape with your normal grip. Keep holding and pluck each string one at a time. ' +
      'Open-string tuning measured in other checks is subtracted when available; otherwise tune first.') +
      '<div class="row"><select id="hcChord" class="grow">' + Object.keys(HC_VOICINGS).map(function (c) {
        return '<option' + (c === chord ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select>' +
      '<span class="mono">' + v.map(function (f) { return f === null ? 'x' : f; }).join('') + '</span></div>' +
      promptCard('hcPrompt') + '<button class="primary block" id="hcRun">Measure (hold the chord)</button>' +
      stringTable(DSP.STRINGS.map(function (s, i) {
        if (v[i] === null) return [HC_STRING_LABELS[i], 'not played'];
        const r = res && res.rows.find(function (x) { return x.string === i; });
        return [HC_STRING_LABELS[i], (v[i] ? 'fret ' + v[i] : 'open'), r ? hcCents(r.cents) : '-'];
      })) + findingsHtml(res ? res.findings : []);
    setPrompt('Ready.');
    $(root, '#hcChord').addEventListener('change', function () {
      const c = this.value;
      hcSaveDraft(function (dd) { return Object.assign({}, dd, { pressure: { chord: c, notes: [null, null, null, null, null, null] } }); });
      render();
    });
    $(root, '#hcRun').addEventListener('click', async function () {
      const my = gen, notes = [null, null, null, null, null, null];
      busy(true);
      for (let s = 0; s < 6; s++) {
        if (v[s] === null) continue;
        setPrompt('<div class="big-label">' + esc(chord) + ': string ' + esc(HC_STRING_LABELS[s]) + '</div><p>keep holding, pluck this string only</p>');
        const m = await listenRetry(hcOpenMidi(s) + v[s], 'pluck string ' + HC_STRING_LABELS[s], my);
        if (stale(my)) return;
        notes[s] = m && m.found && m.matches ? m : null;
      }
      hcSaveDraft(function (dd) { return Object.assign({}, dd, { pressure: { chord: chord, notes: notes } }); });
      render();
    });
  }

  // ----- balance -----
  function renderBalance() {
    const d = hcDraft();
    const res = d.balance.filter(function (x) { return x !== null; }).length ? HC.balance(d.balance) : null;
    root.innerHTML = header('String balance', 'Pluck each open string with the same strength (rest stroke, same spot). ' +
      'Picking varies a lot, so treat the result as low confidence; repeat a few times before adjusting anything.') +
      promptCard('hcPrompt') + '<button class="primary block" id="hcRun">Measure all strings</button>' +
      stringTable(DSP.STRINGS.map(function (s, i) {
        const r = res && res.rows.find(function (x) { return x.string === i; });
        return [HC_STRING_LABELS[i], r ? (r.relDb > 0 ? '+' : '') + r.relDb.toFixed(1) + ' dB' : '-'];
      })) + findingsHtml(res ? res.findings : []);
    setPrompt('Ready.');
    $(root, '#hcRun').addEventListener('click', async function () {
      const my = gen, levels = [];
      busy(true);
      for (let s = 0; s < 6; s++) {
        setPrompt('<div class="big-label">String ' + esc(HC_STRING_LABELS[s]) + '</div><p>pluck open, same strength as the others</p>');
        const m = await listenRetry(hcOpenMidi(s), 'pluck open', my);
        if (stale(my)) return;
        levels.push(m && m.found ? m.peakDb : null);
      }
      hcSaveDraft(function (dd) { return Object.assign({}, dd, { balance: levels }); });
      render();
    });
  }

  // ----- summary, history, compare -----
  function findingsHtml(list) {
    if (!list || !list.length) return '';
    return '<div class="findings">' + list.map(function (f) {
      return '<div class="panel finding ' + f.severity + '"><b>' + esc(f.title) + '</b><div class="row" style="margin-top:6px">' +
        '<span class="pill ' + (f.who === 'LUTHIER' ? 'bad' : 'ok') + '">' + f.who + '</span>' +
        '<span class="pill">' + f.confidence + ' confidence</span></div>' +
        (f.detail ? '<p class="small">' + esc(f.detail) + '</p>' : '') + (f.fix ? '<p class="small muted">Fix: ' + esc(f.fix) + '</p>' : '') + '</div>';
    }).join('') + '</div>';
  }

  function renderSummary() {
    const report = hcBuildReport(hcDraft());
    const findings = HC.summarize(report);
    root.innerHTML = header('Summary report', 'Major issues first. DIY = you can do it with basic tools; LUTHIER = take it to a tech. ' +
      'Confidence says how much to trust the measurement, not how serious the issue is.') +
      (findings.length ? findingsHtml(findings) : '<p class="status">No checks done yet.</p>') +
      (report.sweep ? heatmap(report.sweep.cells) : '') +
      '<button class="primary block" id="hcSave"' + (findings.length ? '' : ' disabled') + '>Save report to history</button><p class="small" id="hcStatus">&nbsp;</p>' +
      copyBlock() + photoChecklist();
    const draftEntry = function () {
      return { id: Date.now(), date: new Date().toISOString(), report: report, findings: findings, raw: hcDraft(), meta: hcMeta() };
    };
    wireCopy(function () {
      const started = hcDraft().startedAt;
      const earlier = (Store.load().healthReports || []).filter(function (r) { return !r.raw || r.raw.startedAt !== started; });
      return HC.reportMarkdown(draftEntry(), earlier.length ? earlier[earlier.length - 1] : null);
    });
    $(root, '#hcSave').addEventListener('click', function () {
      const entry = draftEntry();
      const res = Store.update(function (s) {
        return Object.assign({}, s, { healthReports: (s.healthReports || []).concat([entry]).slice(-30) });
      });
      $(root, '#hcStatus').innerHTML = res.ok ? '<span class="pill ok">saved</span> Start a new draft from the menu for your "after" measurement.'
        : '<span class="pill bad">could not save (storage full?)</span>';
    });
  }

  function renderHistory() {
    const reports = (Store.load().healthReports || []).slice().reverse();
    const sel = view.id ? reports.find(function (r) { return r.id === view.id; }) : null;
    const idx = sel ? reports.indexOf(sel) : -1;
    const prev = idx >= 0 ? reports[idx + 1] : null;
    root.innerHTML = header('History', 'Saved reports, newest first. Open one to see it and compare with the one before it.') +
      (reports.length ? '<div class="tiles">' + reports.map(function (r) {
        const issues = r.findings.filter(function (f) { return f.severity !== 'ok'; }).length;
        return '<button class="tile" data-report="' + r.id + '">' + esc(new Date(r.date).toLocaleDateString()) +
          '<span class="sub">' + esc(new Date(r.date).toLocaleTimeString()) + '</span><span class="pill' + (issues ? ' warn' : ' ok') + '">' +
          issues + ' issue(s)</span></button>';
      }).join('') + '</div>' : '<p class="status">Nothing saved yet.</p>') +
      (sel ? '<h2>Report ' + esc(new Date(sel.date).toLocaleString()) + '</h2>' + findingsHtml(sel.findings) +
        (prev ? '<h2>Before / after</h2>' + compareTable(prev, sel) : '<p class="small muted">No earlier report to compare with.</p>') +
        copyBlock() + photoChecklist() : '');
    if (sel) wireCopy(function () { return HC.reportMarkdown(sel, prev); });
    Array.prototype.forEach.call(root.querySelectorAll('[data-report]'), function (b) {
      b.addEventListener('click', function () { go({ name: 'history', id: Number(b.getAttribute('data-report')) }); });
    });
  }

  function copyBlock() {
    return '<button class="block" id="hcCopy" style="margin-top:12px">Copy report (markdown, for a chat with Claude)</button>' +
      '<p class="small" id="hcCopyStatus">&nbsp;</p><textarea id="hcCopyText" class="mono small" rows="10" readonly hidden></textarea>';
  }

  // Clipboard needs HTTPS/localhost and a tap; if it is refused, show the text selected for manual copy.
  function wireCopy(makeText) {
    $(root, '#hcCopy').addEventListener('click', async function () {
      const text = makeText();
      const status = $(root, '#hcCopyStatus'), area = $(root, '#hcCopyText');
      try {
        await navigator.clipboard.writeText(text);
        status.innerHTML = '<span class="pill ok">copied</span> ' + text.length + ' characters. Paste it into the chat, then attach the photos below.';
        area.hidden = true;
      } catch (e) {
        console.warn('Clipboard refused, showing text instead:', e);
        area.value = text;
        area.hidden = false;
        area.focus();
        area.select();
        status.textContent = 'Copy was blocked by the browser: the text is selected below, copy it by hand.';
      }
    });
  }

  function photoChecklist() {
    return '<h2>Photos to attach</h2><div class="panel"><p class="small muted">Good light, phone held square to the part. ' +
      'For ruler shots, put the ruler on the fret/pickup and keep the scale readable.</p><ol class="small">' +
      HC_PHOTOS.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ol></div>';
  }

  function compareTable(a, b) {
    const rows = HC.compare(a.report, b.report);
    if (!rows.length) return '<p class="small muted">No common measurements.</p>';
    const f = function (v) { return v === null ? '-' : (Math.round(v * 10) / 10).toString(); };
    return '<table class="small"><thead><tr><th>measure</th><th>' + esc(new Date(a.date).toLocaleDateString()) + '</th><th>' +
      esc(new Date(b.date).toLocaleDateString()) + '</th><th>change</th></tr></thead><tbody>' + rows.map(function (r) {
        const diff = r.before !== null && r.after !== null ? r.after - r.before : null;
        return '<tr><td>' + esc(r.key) + '</td><td class="mono">' + f(r.before) + '</td><td class="mono">' + f(r.after) + '</td><td class="mono">' +
          (diff === null ? '' : (diff > 0 ? '+' : '') + f(diff)) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  return {
    title: 'Guitar Health Check',
    mount: function (r) {
      root = r;
      micGate(r, function () {
        AudioEngine.setAnalysis({ pitch: false, chords: false });
        WakeLock.acquire();
        render();
      });
    },
    leave: function () { view = { name: 'gone' }; stopCapture(); clearInterval(tick); WakeLock.release(); }
  };
}
</script>
</body>
</html>
