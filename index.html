<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guitar Coach">
<title>Guitar Coach</title>
<style>
/* ===================== STYLES ===================== */
:root {
  --bg: #111418; --panel: #1b2027; --panel-2: #242b34; --line: #333c47;
  --text: #e8edf2; --muted: #9aa6b2; --accent: #f2a541; --ok: #4cc38a; --warn: #f2c94c; --bad: #eb5757;
  --radius: 14px; --tap: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
header.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; background: rgba(17, 20, 24, .95); border-bottom: 1px solid var(--line);
}
header.top h1 { font-size: 19px; margin: 0; flex: 1; }
main { max-width: 720px; margin: 0 auto; padding: 16px; }
h2 { font-size: 18px; margin: 22px 0 10px; }
p { margin: 8px 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
button, select, .btn {
  min-height: var(--tap); padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none; touch-action: manipulation;
}
button:active, .btn:active { transform: scale(.98); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; }
button.ok { background: var(--ok); border-color: var(--ok); color: #06170f; }
button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
button.back { min-height: 44px; padding: 0 12px; background: transparent; }
button.block { width: 100%; }
select { font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tile { min-height: 110px; flex-direction: column; gap: 4px; text-align: center; padding: 12px; }
.tile .sub { font-weight: 400; font-size: 14px; color: var(--muted); }
.status { padding: 10px 14px; border-radius: 10px; background: var(--panel-2); }
.status.err { background: #3a1d1d; color: #ffd2d2; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--panel-2); font-size: 14px; }
.pill.ok { background: #173d2b; color: #a8f0cb; } .pill.bad { background: #3d1717; color: #ffc0c0; }
.pill.warn { background: #3d3317; color: #f7e3a1; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
td, th { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--line); }

/* tuner */
.tuner-note { font-size: 96px; font-weight: 800; text-align: center; line-height: 1; margin: 8px 0 0; }
.tuner-note sub { font-size: 32px; font-weight: 600; color: var(--muted); }
.tuner-cents { text-align: center; font-size: 22px; margin: 6px 0 12px; }
.needle-wrap { position: relative; height: 70px; margin: 8px 0; }
.needle-scale { position: absolute; inset: 30px 0 auto 0; height: 2px; background: var(--line); }
.needle-zone { position: absolute; top: 18px; height: 26px; left: calc(50% - 5%); width: 10%; background: #173d2b; border-radius: 6px; }
.needle { position: absolute; top: 6px; width: 4px; height: 50px; margin-left: -2px; left: 50%; background: var(--muted); border-radius: 2px; transition: left .08s linear; }
.needle.in { background: var(--ok); }
.needle-labels { position: absolute; top: 52px; left: 0; right: 0; display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.strings div { text-align: center; padding: 10px 0; border-radius: 10px; background: var(--panel-2); font-weight: 700; }
.strings div.on { background: var(--accent); color: #1a1205; }
.strings div.tuned { background: var(--ok); color: #06170f; }

/* meters & debug */
.meter { position: relative; height: 26px; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
.meter .fill { position: absolute; left: 0; top: 6px; bottom: 6px; background: #5b6b7c; width: 0; }
.meter .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
.meter .band { position: absolute; top: 0; bottom: 0; background: rgba(76, 195, 138, .35); border-left: 1px solid var(--ok); border-right: 1px solid var(--ok); }
.meter-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; }
.meter .peak { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--bad); }
.chroma { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; align-items: end; height: 120px; }
.chroma .bar { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.chroma-labels { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; font-size: 12px; text-align: center; color: var(--muted); }
.big-label { font-size: 44px; font-weight: 800; }
.rec-list a { margin: 4px 6px 4px 0; }
input[type=range] { width: 100%; height: 36px; }

/* health check */
.hc-prompt { text-align: center; }
.hc-prompt .big-label { font-size: 30px; }
.heatmap { width: 100%; max-width: 420px; display: block; margin: 8px auto 0; }
.hm-t { fill: var(--muted); font-size: 11px; text-anchor: middle; }
.hm-l { fill: #111; font-size: 12px; font-weight: 700; text-anchor: middle; }
.finding.major { border-left: 5px solid var(--bad); }
.finding.minor { border-left: 5px solid var(--warn); }
.finding.ok { border-left: 5px solid var(--ok); }
textarea { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
input.num { min-height: var(--tap); width: 120px; font: inherit; padding: 0 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text); }
</style>
</head>
<body>
<header class="top">
  <button class="back" id="backBtn" hidden aria-label="Back">&larr; Back</button>
  <h1 id="title">Guitar Coach</h1>
  <span class="pill" id="micPill">mic off</span>
</header>
<main id="app"></main>

<!-- ===================== DSP CORE (pure, no DOM; also loaded by tests/run-tests.js) ===================== -->
<script id="dsp-core">
var GuitarDSP = (function () {
  'use strict';

  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  const CONFIG = Object.freeze({
    a4: 440,
    hop: 1024,                 // samples between analysis frames (~21 ms @ 48 kHz)
    gateWindow: 2048,          // samples used for the level gate / onset
    yin: Object.freeze({ windowSec: 0.04, threshold: 0.15, minFreq: 75, maxFreq: 1400 }),
    chroma: Object.freeze({
      fftSize: 16384, fMin: 70, fMax: 1200, harmonics: 4, harmonicDecay: 0.8,
      maxHarmonicFreq: 5000, peakCents: 25, floorRemoval: 0.5,
      leak: Object.freeze({ h3: 0.15, h5: 0.3, h7: 0.15 })   // harmonic-leak suppression, tuned by tests/tune-leak.js
    }),
    noteStableSec: 0.08,
    chordStableSec: 0.3,
    verifyMargin: 0.03,        // tuned by the margin sweep in tests/run-tests.js
    identifyMargin: 0.02,
    minThirdPc: 0.33,          // a chord needs a 3rd pitch class >= 33 % of the strongest (single notes stay below ~0.31)
    onsetRiseDb: 6,
    gateOffsetDb: 6            // gate = measured noise floor + this
  });

  // ---------- basic helpers ----------
  function midiToFreq(midi, a4) { return (a4 || CONFIG.a4) * Math.pow(2, (midi - 69) / 12); }

  function noteName(midi) { return NOTE_NAMES[((midi % 12) + 12) % 12] + (Math.floor(midi / 12) - 1); }

  function freqToNote(freq, a4) {
    const exact = 69 + 12 * Math.log2(freq / (a4 || CONFIG.a4));
    const midi = Math.round(exact);
    return { midi: midi, name: noteName(midi), pc: ((midi % 12) + 12) % 12, cents: (exact - midi) * 100 };
  }

  function parseNoteName(str) {
    const m = /^([A-G])(#|b)?(-?\d)$/.exec(str);
    if (!m) return null;
    const base = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]];
    const acc = m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0;
    return (parseInt(m[3], 10) + 1) * 12 + base + acc;
  }

  function rms(buf, start, end) {
    let s = 0;
    const a = Math.max(0, start || 0), b = Math.min(buf.length, end === undefined ? buf.length : end);
    for (let i = a; i < b; i++) s += buf[i] * buf[i];
    return b > a ? Math.sqrt(s / (b - a)) : 0;
  }

  function toDb(x) { return 20 * Math.log10(Math.max(x, 1e-9)); }

  // ---------- standard tuning ----------
  const STRINGS = Object.freeze([
    { name: 'E2', label: 'E (6th, low)', midi: 40 },
    { name: 'A2', label: 'A (5th)', midi: 45 },
    { name: 'D3', label: 'D (4th)', midi: 50 },
    { name: 'G3', label: 'G (3rd)', midi: 55 },
    { name: 'B3', label: 'B (2nd)', midi: 59 },
    { name: 'E4', label: 'e (1st, high)', midi: 64 }
  ]);

  function nearestString(freq, a4) {
    const exact = 69 + 12 * Math.log2(freq / (a4 || CONFIG.a4));
    let best = null;
    STRINGS.forEach(function (s, i) {
      const d = (exact - s.midi) * 100;
      if (!best || Math.abs(d) < Math.abs(best.cents)) best = { index: i, string: s, cents: d };
    });
    return best;
  }

  // ---------- FFT (radix-2, cached tables) ----------
  const fftTables = new Map();
  function getFftTables(n) {
    if (fftTables.has(n)) return fftTables.get(n);
    const rev = new Uint32Array(n);
    const bits = Math.log2(n);
    for (let i = 0; i < n; i++) {
      let r = 0;
      for (let b = 0; b < bits; b++) r |= ((i >> b) & 1) << (bits - 1 - b);
      rev[i] = r;
    }
    const cos = new Float64Array(n / 2), sin = new Float64Array(n / 2);
    for (let i = 0; i < n / 2; i++) { cos[i] = Math.cos(-2 * Math.PI * i / n); sin[i] = Math.sin(-2 * Math.PI * i / n); }
    const win = new Float64Array(n);
    for (let i = 0; i < n; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
    const t = { rev: rev, cos: cos, sin: sin, win: win, re: new Float64Array(n), im: new Float64Array(n) };
    fftTables.set(n, t);
    return t;
  }

  // Magnitude spectrum of the last n samples of buf (Hann-windowed). Returns a new Float64Array(n/2).
  function magnitudeSpectrum(buf, n) {
    const t = getFftTables(n);
    const re = t.re, im = t.im;
    const offset = buf.length - n;
    for (let i = 0; i < n; i++) {
      const src = offset + i;
      re[t.rev[i]] = src >= 0 ? buf[src] * t.win[i] : 0;
      im[i] = 0;
    }
    for (let size = 2; size <= n; size <<= 1) {
      const half = size >> 1, step = n / size;
      for (let i = 0; i < n; i += size) {
        for (let j = 0, k = 0; j < half; j++, k += step) {
          const a = i + j, b = a + half;
          const tr = re[b] * t.cos[k] - im[b] * t.sin[k];
          const ti = re[b] * t.sin[k] + im[b] * t.cos[k];
          re[b] = re[a] - tr; im[b] = im[a] - ti;
          re[a] += tr; im[a] += ti;
        }
      }
    }
    const mag = new Float64Array(n / 2);
    for (let i = 0; i < n / 2; i++) mag[i] = Math.sqrt(re[i] * re[i] + im[i] * im[i]);
    return mag;
  }

  // ---------- YIN pitch detection ----------
  // Returns { freq, clarity } or null when no clear periodicity.
  function yin(buf, sr, opts) {
    const o = Object.assign({}, CONFIG.yin, opts || {});
    const W = Math.round(o.windowSec * sr);
    const tauMin = Math.max(2, Math.floor(sr / o.maxFreq));
    const tauMax = Math.ceil(sr / o.minFreq);
    const start = buf.length - (W + tauMax + 1);
    if (start < 0) return null;
    const d = new Float64Array(tauMax + 2);
    for (let tau = 1; tau <= tauMax + 1; tau++) {
      let s = 0;
      for (let j = 0; j < W; j++) {
        const diff = buf[start + j] - buf[start + j + tau];
        s += diff * diff;
      }
      d[tau] = s;
    }
    const cmnd = new Float64Array(tauMax + 2);
    cmnd[0] = 1;
    let running = 0;
    for (let tau = 1; tau <= tauMax + 1; tau++) {
      running += d[tau];
      cmnd[tau] = running > 0 ? d[tau] * tau / running : 1;
    }
    let tau = -1;
    for (let t = tauMin; t <= tauMax; t++) {
      if (cmnd[t] < o.threshold) {
        while (t + 1 <= tauMax && cmnd[t + 1] < cmnd[t]) t++;
        tau = t;
        break;
      }
    }
    if (tau < 0) return null;
    const a = cmnd[tau - 1], b = cmnd[tau], c = cmnd[tau + 1];
    const denom = a - 2 * b + c;
    const shift = denom !== 0 ? 0.5 * (a - c) / denom : 0;
    const refined = tau + Math.max(-1, Math.min(1, shift));
    return { freq: sr / refined, clarity: 1 - b };
  }

  // Two cascaded 2nd-order low-pass sections (Butterworth). Returns a new Float32Array.
  function lowpass(x, sr, fc) {
    const w = 2 * Math.PI * fc / sr, alpha = Math.sin(w) / (2 * Math.SQRT1_2), cw = Math.cos(w);
    const a0 = 1 + alpha;
    const b0 = (1 - cw) / 2 / a0, b1 = (1 - cw) / a0, b2 = b0, a1 = -2 * cw / a0, a2 = (1 - alpha) / a0;
    let y = Float32Array.from(x);
    for (let pass = 0; pass < 2; pass++) {
      const out = new Float32Array(y.length);
      let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
      for (let i = 0; i < y.length; i++) {
        const v = b0 * y[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
        x2 = x1; x1 = y[i]; y2 = y1; y1 = v; out[i] = v;
      }
      y = out;
    }
    return y;
  }

  // Two-pass pitch: YIN estimate, then YIN again on the signal low-passed at 1.4x that estimate.
  // On bright direct input the slightly sharp upper partials of a real string bias a single YIN pass by several cents.
  function refinedPitch(buf, sr) {
    const p = yin(buf, sr);
    if (!p) return null;
    const need = Math.round(CONFIG.yin.windowSec * sr) + Math.ceil(sr / CONFIG.yin.minFreq) + 2 + Math.round(0.05 * sr);
    const seg = buf.length > need ? buf.subarray(buf.length - need) : buf;
    const q = yin(lowpass(seg, sr, Math.min(1.4 * p.freq, 0.45 * sr)), sr);
    return q && Math.abs(1200 * Math.log2(q.freq / p.freq)) < 50 ? { freq: q.freq, clarity: p.clarity } : p;
  }

  // ---------- chroma ----------
  // Harmonic-summation pitch salience folded into 12 pitch classes (index 0 = C).
  function chromaFromSpectrum(mag, sr, n, opts) {
    const o = Object.assign({}, CONFIG.chroma, opts || {});
    const binHz = sr / n;
    const comp = new Float64Array(mag.length);
    for (let i = 0; i < mag.length; i++) comp[i] = Math.sqrt(mag[i]);
    const q = Math.pow(2, o.peakCents / 1200);
    function peakAt(f) {
      const lo = Math.max(1, Math.floor(f / q / binHz)), hi = Math.min(comp.length - 1, Math.ceil(f * q / binHz));
      let m = 0;
      for (let k = lo; k <= hi; k++) if (comp[k] > m) m = comp[k];
      return m;
    }
    const midiLo = Math.ceil(69 + 12 * Math.log2(o.fMin / CONFIG.a4));
    const midiHi = Math.floor(69 + 12 * Math.log2(o.fMax / CONFIG.a4));
    const sal = [];
    for (let midi = midiLo; midi <= midiHi; midi++) {
      const f = midiToFreq(midi);
      let s = 0, w = 1;
      for (let h = 1; h <= o.harmonics && h * f < o.maxHarmonicFreq && h * f < sr / 2; h++) {
        s += w * peakAt(h * f);
        w *= o.harmonicDecay;
      }
      sal.push({ midi: midi, s: s });
    }
    // remove a fraction of the median salience (broadband noise floor)
    const sorted = sal.map(function (x) { return x.s; }).sort(function (a, b) { return a - b; });
    const floor = sorted[Math.floor(sorted.length / 2)] * o.floorRemoval;
    const clean = suppressHarmonicLeaks(sal.map(function (x) { return Math.max(0, x.s - floor); }), o.leak);
    const chroma = new Float64Array(12);
    sal.forEach(function (x, i) { chroma[x.midi % 12] += clean[i]; });
    return chroma;
  }

  // Non-octave overtones of a low note show up as salience at other pitch classes:
  // 3rd harmonic = fifth (+19 semitones), 5th = major third (+28, 14 c flat), 7th = flat seventh (+34, 31 c flat).
  // The 5th harmonic of a minor chord's root is its MAJOR third, which flips minor to major on bright direct input.
  // Walking low -> high, subtract the share predicted from the (already cleaned) lower note. Octave harmonics fold
  // into the same pitch class and are left alone. Returns a new array.
  const LEAK_STEPS = Object.freeze([['h3', 19], ['h5', 28], ['h7', 34]]);
  function suppressHarmonicLeaks(sal, leak) {
    const out = [];
    for (let i = 0; i < sal.length; i++) {
      let predicted = 0;
      LEAK_STEPS.forEach(function (step) {
        const j = i - step[1];
        if (j >= 0 && leak[step[0]]) predicted += leak[step[0]] * out[j];
      });
      out.push(Math.max(0, sal[i] - predicted));
    }
    return out;
  }

  function chromaOf(buf, sr, opts) {
    const n = (opts && opts.fftSize) || CONFIG.chroma.fftSize;
    return chromaFromSpectrum(magnitudeSpectrum(buf, n), sr, n, opts);
  }

  // ---------- chord templates ----------
  const QUALITIES = Object.freeze({ '': [[0, 1], [4, 1], [7, 1]], m: [[0, 1], [3, 1], [7, 1]], '7': [[0, 1], [4, 1], [7, 1], [10, 0.8]] });
  const LIBRARY = Object.freeze(['E', 'Em', 'A', 'Am', 'D', 'Dm', 'G', 'C', 'E7', 'A7', 'D7']);

  function buildTemplate(root, quality) {
    const t = new Float64Array(12);
    QUALITIES[quality].forEach(function (iv) { t[(root + iv[0]) % 12] = iv[1]; });
    return t;
  }

  const TEMPLATES = (function () {
    const out = {};
    NOTE_NAMES.forEach(function (name, root) {
      Object.keys(QUALITIES).forEach(function (q) { out[name + q] = buildTemplate(root, q); });
    });
    return Object.freeze(out);
  })();
  const ALL_CHORDS = Object.freeze(Object.keys(TEMPLATES));

  function cosine(a, b) {
    let ab = 0, aa = 0, bb = 0;
    for (let i = 0; i < 12; i++) { ab += a[i] * b[i]; aa += a[i] * a[i]; bb += b[i] * b[i]; }
    return aa > 0 && bb > 0 ? ab / Math.sqrt(aa * bb) : 0;
  }

  // Sorted [{ id, score }] best first.
  function rankChords(chroma, ids) {
    return (ids || ALL_CHORDS)
      .map(function (id) { return { id: id, score: cosine(chroma, TEMPLATES[id]) }; })
      .sort(function (a, b) { return b.score - a.score; });
  }

  // Verify: expected must be #1 among the library AND beat the runner-up by `margin`.
  function verifyChord(ranked, expected, margin) {
    const rank = ranked.findIndex(function (r) { return r.id === expected; }) + 1;
    const lead = ranked[0].score - (ranked[1] ? ranked[1].score : 0);
    return { pass: rank === 1 && lead >= margin, rank: rank, lead: lead };
  }

  // ---------- frame analysis ----------
  // buf: the latest samples (length >= chroma fftSize). Returns a plain frame object.
  function analyzeFrame(buf, sr, opts) {
    const o = opts || {};
    const gateDb = o.gateDb === undefined ? -60 : o.gateDb;
    const levelDb = toDb(rms(buf, buf.length - CONFIG.gateWindow));
    const voiced = levelDb > gateDb;
    const frame = { levelDb: levelDb, voiced: voiced, pitch: null, chroma: null, lib: null, all: null };
    if (!voiced) return frame;
    if (o.pitch !== false) {
      const p = refinedPitch(buf, sr);
      frame.pitch = p ? Object.assign({}, p, freqToNote(p.freq, o.a4)) : null;
    }
    if (o.chords !== false) {
      frame.chroma = chromaOf(buf, sr, o.chroma);
      frame.lib = rankChords(frame.chroma, o.library || LIBRARY);
      frame.all = rankChords(frame.chroma, ALL_CHORDS);
    }
    return frame;
  }

  // ---------- trackers (immutable state machines) ----------
  // A label must stay identical for stableSec to be confirmed. `onset` re-arms confirmation.
  function initTracker() { return { candidate: null, since: 0, confirmed: null, confirmedAt: null, event: null }; }

  function stepTracker(state, label, t, stableSec, onset) {
    const base = onset ? { candidate: null, since: t, confirmed: null, confirmedAt: null } : state;
    if (label === null) {
      return { candidate: null, since: t, confirmed: base.confirmed, confirmedAt: base.confirmedAt, event: null };
    }
    if (label !== base.candidate) {
      return { candidate: label, since: t, confirmed: base.confirmed, confirmedAt: base.confirmedAt, event: null };
    }
    if (t - base.since >= stableSec - 1e-9 && base.confirmed !== label) {
      return { candidate: label, since: base.since, confirmed: label, confirmedAt: t, event: 'confirm' };
    }
    return { candidate: base.candidate, since: base.since, confirmed: base.confirmed, confirmedAt: base.confirmedAt, event: null };
  }

  // Frame -> chord label for the tracker (null = no confident chord).
  function chordLabel(frame, mode, margin) {
    if (!frame.voiced || !frame.lib || !hasThreePitchClasses(frame.chroma)) return null;
    const ranked = mode === 'identify' ? frame.all : frame.lib;
    const m = margin === undefined ? (mode === 'identify' ? CONFIG.identifyMargin : CONFIG.verifyMargin) : margin;
    return ranked[0].score - ranked[1].score >= m ? ranked[0].id : null;
  }

  // Rejects single notes (and power chords): their overtones give at most two strong pitch classes.
  function hasThreePitchClasses(chroma) {

  }

  function noteLabel(frame) {
    if (!frame.voiced || !frame.pitch || Math.abs(frame.pitch.cents) > 50) return null;
    return frame.pitch.midi;
  }

  // Onset: short-window level rises by onsetRiseDb over the previous frame's level.
  function isOnset(prevLevelDb, levelDb, gateDb) {
    return levelDb > gateDb && levelDb - prevLevelDb >= CONFIG.onsetRiseDb;
  }

  // ---------- WAV encoding (16-bit PCM mono) ----------
  function encodeWav(samples, sr) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);

    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
    }
    return buf;
  }

  return Object.freeze({
    encodeWav: encodeWav,
    NOTE_NAMES: NOTE_NAMES, CONFIG: CONFIG, STRINGS: STRINGS, LIBRARY: LIBRARY, ALL_CHORDS: ALL_CHORDS, TEMPLATES: TEMPLATES,
    midiToFreq: midiToFreq, noteName: noteName, freqToNote: freqToNote, parseNoteName: parseNoteName,
    rms: rms, toDb: toDb, nearestString: nearestString,
    magnitudeSpectrum: magnitudeSpectrum, yin: yin, lowpass: lowpass, refinedPitch: refinedPitch, chromaFromSpectrum: chromaFromSpectrum, chromaOf: chromaOf,
    cosine: cosine, rankChords: rankChords, verifyChord: verifyChord,
    analyzeFrame: analyzeFrame, initTracker: initTracker, stepTracker: stepTracker,
    chordLabel: chordLabel, noteLabel: noteLabel, isOnset: isOnset
  });
})();

<!-- ===================== HEALTH CORE (pure analysis for the Guitar Health Check; also loaded by tests) ===================== -->
<script id="health-core">
var GuitarHealth = (function () {
  'use strict';
  const DSP = GuitarDSP;

  const TOL = Object.freeze({
    intonationCents: 5,      // 12th fret vs open/harmonic
    nutSharpCents: 8,        // 1st fret vs open
    driftCents: 5,           // tuning stability
    pressureSharpCents: 8,   // fretted notes in a held chord vs open-string reference
    balanceDb: 6,            // string level vs median
    deadRatio: 0.5           // sustain < 50 % of same-string neighbours
  });

  // ---------- measurement primitives ----------
  // First 5 ms window above gate; returns seconds or null.
  function findOnset(x, sr, gateDb) {
    const w = Math.max(64, Math.round(0.005 * sr));
    for (let i = 0; i + w <= x.length; i += w) {
      if (DSP.toDb(DSP.rms(x, i, i + w)) > gateDb) return i / sr;
    }
    return null;
  }

  function median(xs) {
    if (!xs.length) return null;
    const s = xs.slice().sort(function (a, b) { return a - b; });
    const m = Math.floor(s.length / 2);
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function mad(xs) {
    const m = median(xs);
    return median(xs.map(function (v) { return Math.abs(v - m); }));
  }

  // Sustain: seconds from the attack peak until the level has fallen 20 dB (capped at the capture end).
  function decayTime(x, sr, onsetSec) {
    const w = Math.round(0.02 * sr);
    const start = Math.round(onsetSec * sr);
    let peak = -200, peakIdx = start;
    for (let i = start; i + w <= Math.min(x.length, start + Math.round(0.3 * sr)); i += w) {
      const db = DSP.toDb(DSP.rms(x, i, i + w));
      if (db > peak) { peak = db; peakIdx = i; }
    }
    for (let i = peakIdx; i + w <= x.length; i += w) {
      if (DSP.toDb(DSP.rms(x, i, i + w)) < peak - 20) return { peakDb: peak, decaySec: (i - peakIdx) / sr, capped: false };
    }
    return { peakDb: peak, decaySec: (x.length - peakIdx) / sr, capped: true };
  }

  // EXPERIMENTAL, logged only (not used for any flag): attack brightness excess (dB) = high band (3-8 kHz) vs
  // low band (60-1500 Hz) in the attack, minus the same ratio 0.6 s later. Synthetic tests showed it does NOT
  // separate buzz from normal fast decay of high partials, so buzz is marked by the player during the sweep.
  // Kept so real recordings of known buzzing frets can be evaluated later.
  function bandPow(mag, binHz, lo, hi) {
    let s = 0;
    for (let k = Math.ceil(lo / binHz); k <= Math.min(mag.length - 1, Math.floor(hi / binHz)); k++) s += mag[k] * mag[k];
    return s + 1e-20;
  }
  function attackNoise(x, sr, onsetSec) {
    const n = 4096, binHz = sr / n;
    const ratioAt = function (startSec) {
      const end = Math.round(startSec * sr) + n;
      if (end > x.length) return null;
      const mag = DSP.magnitudeSpectrum(x.subarray(end - n, end), n);
      return 10 * Math.log10(bandPow(mag, binHz, 3000, 8000) / bandPow(mag, binHz, 60, 1500));
    };
    const a = ratioAt(onsetSec + 0.02), b = ratioAt(onsetSec + 0.6);
    return a === null || b === null ? null : a - b;
  }



  // Median pitch over the steady part (0.25-1.2 s after onset by default). The first ~200 ms of a pluck is sharp.
  function steadyPitch(x, sr, onsetSec, from, to) {
    const a = onsetSec + (from === undefined ? 0.25 : from), b = onsetSec + (to === undefined ? 1.2 : to);
    const hop = Math.round(0.02 * sr), span = 4096;
    const freqs = [], clar = [];
    for (let i = Math.round(a * sr); i <= Math.min(x.length, Math.round(b * sr)); i += hop) {
      if (i - span < 0) continue;
      const p = DSP.yin(x.subarray(i - span, i), sr);
      if (p && p.clarity > 0.85) { freqs.push(p.freq); clar.push(p.clarity); }
    }
    if (freqs.length < 5) return null;
    const cents = freqs.map(function (f) { return 1200 * Math.log2(f / freqs[0]); });
    const medFreq = freqs[0] * Math.pow(2, median(cents) / 1200);
    return { freq: medFreq, spreadCents: mad(cents) * 1.4826, frames: freqs.length, clarity: median(clar) };
  }

  // Full analysis of one captured pluck. expectedMidi optional.
  // When the note is known, everything above ~1.4x its fundamental is filtered out before measuring pitch:
  // on bright direct input the slightly sharp upper partials of a real string otherwise bias the period estimate.
  // onsetSec (optional): attack position already known by the caller (live capture); otherwise first gate crossing.
  function analyzeNote(x, sr, gateDb, expectedMidi, onsetSec) {
    const onset = onsetSec === undefined ? findOnset(x, sr, gateDb) : onsetSec;
    if (onset === null) return { found: false, reason: 'no note heard' };
    const pitchSrc = expectedMidi === undefined ? x : DSP.lowpass(x, sr, Math.min(1.4 * DSP.midiToFreq(expectedMidi), 0.45 * sr));
    const p = steadyPitch(pitchSrc, sr, onset);
    const d = decayTime(x, sr, onset);
    if (!p) return { found: false, reason: 'no stable pitch', onsetSec: onset, peakDb: d.peakDb, decaySec: d.decaySec };
    const note = DSP.freqToNote(p.freq);
    const ref = expectedMidi === undefined ? note.midi : expectedMidi;
    const centsVsRef = 1200 * Math.log2(p.freq / DSP.midiToFreq(ref));
    return {
      found: true, onsetSec: onset, freq: p.freq, midi: note.midi, name: note.name,
      cents: centsVsRef, matches: expectedMidi === undefined || note.midi === expectedMidi,
      spreadCents: p.spreadCents, clarity: p.clarity, peakDb: d.peakDb, decaySec: d.decaySec, decayCapped: d.capped,
      noise: attackNoise(x, sr, onset)
    };
  }

  function confidenceFromSpread(spread) { return spread < 2 ? 'high' : spread < 5 ? 'medium' : 'low'; }

  function finding(check, severity, who, confidence, title, detail, fix) {
    return { check: check, severity: severity, who: who, confidence: confidence, title: title, detail: detail, fix: fix };
  }

  // ---------- 1. intonation ----------
  // ref: measurement of open string or 12th-fret harmonic; fretted: 12th fret. Both are analyzeNote results.
  function intonation(stringIdx, ref, fretted, refKind) {
    const target = ref.freq * (refKind === 'harmonic' ? 1 : 2);
    const offset = 1200 * Math.log2(fretted.freq / target);
    const status = Math.abs(offset) <= TOL.intonationCents ? 'ok' : offset > 0 ? 'sharp' : 'flat';
    const advice = status === 'ok' ? 'In tolerance.'
      : status === 'sharp'
        ? 'Fretted note is sharp: move this saddle AWAY from the neck (toward the tailpiece).'
        : 'Fretted note is flat: move this saddle TOWARD the neck.';
    return {
      string: stringIdx, offsetCents: offset, status: status, advice: advice,
      confidence: confidenceFromSpread(Math.max(ref.spreadCents, fretted.spreadCents))
    };
  }

  function intonationFindings(results) {
    const bad = results.filter(function (r) { return r && r.status !== 'ok'; });
    if (!results.filter(Boolean).length) return [];
    if (!bad.length) return [finding('intonation', 'ok', 'DIY', 'high', 'Intonation within +-5 cents on all measured strings', '', '')];
    return bad.map(function (r) {
      return finding('intonation', Math.abs(r.offsetCents) > 15 ? 'major' : 'minor', 'DIY', r.confidence,
        'Intonation off on string ' + DSP.STRINGS[r.string].label + ': ' + fmtCents(r.offsetCents),
        r.advice,
        'Loosen the string a little, move the saddle in small steps (a quarter to half turn of the screw), retune, re-measure. ' +
        'Do this with fresh strings and after action/relief are set. If the saddle runs out of travel, a luthier can flip the saddle or move the bridge.');
    });
  }

  // ---------- 2. nut height ----------
  // perString: [{ open: analyzeNote, fret1: analyzeNote }] ; 1st fret should be exactly +100 c above open.
  function nut(perString) {
    const rows = perString.map(function (p, i) {
      if (!p || !p.open || !p.fret1) return null;
      return { string: i, sharpCents: 1200 * Math.log2(p.fret1.freq / p.open.freq) - 100, spread: Math.max(p.open.spreadCents, p.fret1.spreadCents) };
    });
    const valid = rows.filter(Boolean);
    const high = valid.filter(function (r) { return r.sharpCents > TOL.nutSharpCents; });
    const med = median(valid.map(function (r) { return r.sharpCents; }));
    let f = [];
    if (valid.length >= 3 && high.length >= Math.ceil(valid.length / 2)) {
      f = [finding('nut', 'major', 'LUTHIER', valid.length >= 5 ? 'medium' : 'low',
        'Nut slots likely too high (1st fret notes sharp by ~' + Math.round(med) + ' c on ' + high.length + '/' + valid.length + ' strings)',
        'Chords near the nut will sound out of tune even when the open strings are in tune.',
        'A luthier can lower the nut slots (cheap job, but filing too deep ruins the nut).')];
    } else if (high.length) {
      f = high.map(function (r) {
        return finding('nut', 'minor', 'LUTHIER', 'low', 'String ' + DSP.STRINGS[r.string].label + ' 1st fret sharp ' + fmtCents(r.sharpCents),
          'Single string: could be that nut slot, or pressing hard near the nut. Re-test with a light touch first.', 'If it repeats, ask a luthier to check that nut slot.');
      });
    } else if (valid.length) {
      f = [finding('nut', 'ok', 'LUTHIER', 'medium', 'Nut height looks fine (1st fret median ' + fmtCents(med) + ')', '', '')];
    }
    return { rows: rows, medianSharp: med, findings: f };
  }

  // ---------- 3. fret sweep ----------
  // grid[string][fret-1] = analyzeNote result + { userBuzz }, { skipped: true }, or null (not tested yet). Frets 1..12.
  // Dead / undetected are automatic; buzz comes from the player's ear (see attackNoise note).
  function sweep(grid) {
    const cells = grid.map(function (row) {
      return row.map(function (m, f) {
        if (m === null || m === undefined) return { status: 'untested' };
        if (m.skipped) return { status: 'skipped' };
        if (!m.found || !m.matches) return { status: 'undetected', heard: m.found ? m.name : null };
        const neighbours = row.slice(Math.max(0, f - 2), f + 3)
          .filter(function (n) { return n && n.found && n.matches && n !== m; })
          .map(function (n) { return n.decaySec; });
        const nbMed = median(neighbours);
        const dead = nbMed !== null && !m.decayCapped && m.decaySec < TOL.deadRatio * nbMed;
        return { status: m.userBuzz ? 'buzz' : dead ? 'dead' : 'ok', noise: m.noise, decaySec: m.decaySec, cents: m.cents };
      });
    });
    return { cells: cells, findings: sweepFindings(cells) };
  }

  function sweepFindings(cells) {
    const list = [];
    cells.forEach(function (row, s) { row.forEach(function (c, f) { list.push({ s: s, fret: f + 1, c: c }); }); });
    const tested = list.filter(function (x) { return x.c.status !== 'skipped' && x.c.status !== 'untested'; });
    if (!tested.length) return [];
    const buzz = list.filter(function (x) { return x.c.status === 'buzz'; });
    const dead = list.filter(function (x) { return x.c.status === 'dead'; });
    const und = list.filter(function (x) { return x.c.status === 'undetected'; });
    const out = [];
    const name = function (x) { return 'string ' + (6 - x.s) + ' fret ' + x.fret; };   // s: 0 = low E = string 6
    if (buzz.length) {
      const lowFrets = buzz.filter(function (x) { return x.fret <= 5; });
      const strings = new Set(buzz.map(function (x) { return x.s; }));
      const fretsHit = {};
      buzz.forEach(function (x) { fretsHit[x.fret] = (fretsHit[x.fret] || 0) + 1; });
      const sameFret = Object.keys(fretsHit).filter(function (k) { return fretsHit[k] >= 2; });
      let cause, fix, who;
      if (lowFrets.length >= 3 && strings.size >= 3) {
        cause = 'Buzz clustered on the low frets across several strings: usually too little neck relief (or a low nut).';
        fix = 'Check relief (manual checklist). A slight truss-rod loosening (1/8 turn at a time) is DIY if you are comfortable; otherwise a luthier.';
        who = 'DIY';
      } else if (sameFret.length) {
        cause = 'Several strings buzz at the same fret(s) ' + sameFret.join(', ') + ': often one fret sitting high (the buzz happens on the fret BELOW the high one).';
        fix = 'Fret levelling / seating is luthier work.';
        who = 'LUTHIER';
      } else if (strings.size === 1 && buzz.length >= 4) {
        cause = 'Buzz along one string: action on that side of the bridge is probably low.';
        fix = 'Raise that side of the Tune-o-matic a little with its thumbwheel, then re-test.';
        who = 'DIY';
      } else {
        cause = 'Isolated buzz spots. Re-test them with a firm pick attack; consistent spots usually mean an uneven fret.';
        fix = 'If they repeat, a luthier can level the frets.';
        who = 'LUTHIER';
      }
      out.push(finding('buzz', buzz.length >= 6 ? 'major' : 'minor', who, 'medium',
        'Buzz you marked at ' + buzz.length + ' position(s): ' + buzz.map(name).join(', '), cause, fix));
    }
    if (dead.length) {
      out.push(finding('dead', 'minor', 'LUTHIER', 'medium',
        'Short sustain (dead spot?) at ' + dead.map(name).join(', '),
        'Sustain under half of the neighbouring frets. Dead spots are often a neck resonance (normal on many guitars); a loose or high fret is also possible.',
        'Only worth a luthier visit if it bothers you or it comes with buzz.'));
    }
    if (und.length) {
      out.push(finding('undetected', 'minor', 'DIY', 'medium', 'Notes not detected at ' + und.map(name).join(', '),
        'Either the note did not ring (fretting, muting, heavy buzz) or the app heard another note.', 'Re-test those positions.'));
    }
    if (!out.length) out.push(finding('buzz', 'ok', 'DIY', 'medium', 'No buzz or dead notes found on ' + tested.length + ' positions', '', ''));
    return out;
  }

  // ---------- 4. tuning stability ----------
  // before/after: arrays of 6 analyzeNote results (open strings) or null.
  function stability(before, after, minutes) {
    const rows = before.map(function (b, i) {
      const a = after[i];
      if (!b || !a || !b.found || !a.found) return null;
      return { string: i, driftCents: 1200 * Math.log2(a.freq / b.freq) };
    });
    const valid = rows.filter(Boolean);
    const moved = valid.filter(function (r) { return Math.abs(r.driftCents) > TOL.driftCents; });
    let f;
    if (!valid.length) f = [];
    else if (!moved.length) {
      f = [finding('stability', 'ok', 'DIY', 'high', 'Tuning stable after ' + Math.round(minutes) + ' min (max drift ' +
        fmtCents(valid.reduce(function (m, r) { return Math.abs(r.driftCents) > Math.abs(m) ? r.driftCents : m; }, 0)) + ')', '', '')];
    } else {
      const allFlat = moved.length >= 4 && moved.every(function (r) { return r.driftCents < 0; });
      f = [finding('stability', 'minor', 'DIY', 'high',
        'Tuning drifted on ' + moved.map(function (r) { return DSP.STRINGS[r.string].name + ' ' + fmtCents(r.driftCents); }).join(', '),
        allFlat ? 'Most strings went flat together: typical of new strings still stretching, or a temperature change.'
          : 'Single strings slipping: string not settled at the tuner post, a slipping tuner, or binding in the nut (pings when tuning).',
        allFlat ? 'Stretch the strings gently, retune, repeat until they hold.'
          : 'Check the winds on the tuner post, put pencil graphite in the nut slot. If one string keeps slipping, the tuner may need replacing (DIY or luthier).')];
    }
    return { rows: rows, minutes: minutes, findings: f };
  }

  // ---------- 5. pressure ----------
  // perString: [{ fretted: bool, m: analyzeNote with expectedMidi }] for the strings of the held chord.
  function pressure(perString, openRef) {
    const rows = perString.map(function (p, i) {
      if (!p || !p.m || !p.m.found) return null;
      const refOffset = openRef && openRef[i] && openRef[i].found ? openRef[i].cents : 0;
      return { string: i, fretted: p.fretted, cents: p.m.cents - refOffset };
    }).filter(Boolean);
    const fr = rows.filter(function (r) { return r.fretted; });
    const med = median(fr.map(function (r) { return r.cents; }));
    let f = [];
    if (fr.length >= 2 && med > TOL.pressureSharpCents) {
      f = [finding('pressure', 'minor', 'DIY', 'medium', 'Fretted notes sharp by ~' + Math.round(med) + ' c while holding the chord',
        'Pressing too hard (or pulling the string sideways) bends the note sharp.',
        'Press just behind the fret with the lightest pressure that still rings clean. Re-test to see the cents drop.')];
    } else if (fr.length >= 2) {
      f = [finding('pressure', 'ok', 'DIY', 'medium', 'Fretting pressure fine (fretted notes median ' + fmtCents(med) + ')', '', '')];
    }
    return { rows: rows, medianFretted: med, findings: f };
  }

  // ---------- 6. string balance ----------
  function balance(levels) {
    const valid = levels.map(function (l, i) { return l === null || l === undefined ? null : { string: i, db: l }; }).filter(Boolean);
    const med = median(valid.map(function (r) { return r.db; }));
    const rows = valid.map(function (r) { return { string: r.string, relDb: r.db - med }; });
    const off = rows.filter(function (r) { return Math.abs(r.relDb) > TOL.balanceDb; });
    let f = [];
    if (valid.length >= 4) {
      f = off.length
        ? [finding('balance', 'minor', 'DIY', 'low', 'Uneven string levels: ' + off.map(function (r) { return DSP.STRINGS[r.string].name + ' ' + (r.relDb > 0 ? '+' : '') + r.relDb.toFixed(1) + ' dB'; }).join(', '),
          'Low confidence: picking strength varies a lot. Repeat a few times before adjusting.',
          'Adjust pickup height or the pole screw under a weak/strong string in small steps.')]
        : [finding('balance', 'ok', 'DIY', 'low', 'String levels balanced within +-' + TOL.balanceDb + ' dB', '', '')];
    }
    return { rows: rows, findings: f };
  }

  // ---------- manual checklist ----------
  // Typical starting points for a Les Paul-style guitar (not absolute rules).
  const MANUAL_SPEC = Object.freeze({
    actionBassMm: { lo: 1.4, hi: 2.4, typical: '1.6-2.0 mm (about 4/64")' },
    actionTrebleMm: { lo: 1.0, hi: 2.0, typical: '1.2-1.6 mm (about 3/64")' },
    reliefMm: { lo: 0.1, hi: 0.4, typical: '0.2-0.3 mm (about 0.010")' },
    stringAgeWeeks: { hi: 12 },
    pickupNeckMm: { lo: 1.6, hi: 3.2, typical: 'about 2.4 mm (3/32") bass side' },
    pickupBridgeMm: { lo: 1.2, hi: 2.4, typical: 'about 1.6 mm (1/16")' }
  });

  function num(v) { const n = Number(v); return v === '' || v === null || v === undefined || isNaN(n) ? null : n; }

  function manual(m) {
    const out = [];
    const S = MANUAL_SPEC;
    const range = function (key, label, val, lowFix, highFix, whoLow, whoHigh) {
      const v = num(val), s = S[key];
      if (v === null) return;
      if (v < s.lo) out.push(finding('manual', 'minor', whoLow, 'medium', label + ' low: ' + v + ' mm (typical ' + s.typical + ')', '', lowFix));
      else if (v > s.hi) out.push(finding('manual', 'minor', whoHigh, 'medium', label + ' high: ' + v + ' mm (typical ' + s.typical + ')', '', highFix));
      else out.push(finding('manual', 'ok', whoHigh, 'medium', label + ' OK: ' + v + ' mm', '', ''));
    };
    range('reliefMm', 'Neck relief', m.reliefMm,
      'Too straight (or back-bowed) causes buzz on low frets: loosen the truss rod 1/8 turn at a time, wait, re-measure.',
      'Too much bow raises action in the middle of the neck: tighten the truss rod 1/8 turn at a time. Never force it; if it is stiff, stop and see a luthier.',
      'DIY', 'DIY');
    range('actionBassMm', 'Action at 12th fret, low E', m.actionBassMm,
      'Raise the bass side of the bridge with its thumbwheel.', 'Lower the bass side thumbwheel (set relief first).', 'DIY', 'DIY');
    range('actionTrebleMm', 'Action at 12th fret, high e', m.actionTrebleMm,
      'Raise the treble side of the bridge with its thumbwheel.', 'Lower the treble side thumbwheel (set relief first).', 'DIY', 'DIY');
    range('pickupNeckMm', 'Neck pickup height', m.pickupNeckMm, 'Lower is fine for tone; raise slightly for more output.', 'Too close can pull the strings out of tune: lower it.', 'DIY', 'DIY');
    range('pickupBridgeMm', 'Bridge pickup height', m.pickupBridgeMm, 'Raise slightly for more output.', 'Too close can pull the strings out of tune: lower it.', 'DIY', 'DIY');
    const age = num(m.stringAgeWeeks);
    if (age !== null) {
      out.push(age > S.stringAgeWeeks.hi
        ? finding('manual', 'minor', 'DIY', 'high', 'Strings are ' + age + ' weeks old', 'Old strings sound dull, go out of tune and make intonation impossible to set.', 'Change strings BEFORE adjusting intonation.')
        : finding('manual', 'ok', 'DIY', 'high', 'Strings ' + age + ' weeks old', '', ''));
    }
    return out;
  }

  // ---------- summary + compare ----------
  const SEVERITY_ORDER = { major: 0, minor: 1, ok: 2 };
  function summarize(report) {

    out.push('- Input: ' + (meta.input || 'unknown') + (meta.sampleRate ? ' @ ' + meta.sampleRate + ' Hz' : ''));
    out.push('- Method: plucked notes through the input; pitch = median of the steady part (0.25-1.2 s after the attack), ' +
      'low-passed above the fundamental. Buzz is marked by ear, not measured.');

    if (rep.stability) {

        rep.stability.rows.map(function (r, s) {

        })));

      out.push('\n## Fretting pressure (chord ' + raw.pressure.chord + ', cents vs open-string reference)\n' + mdTable(['string', 'fretted', 'cents'],

<script id="app-core">
'use strict';

const Store = (function () {
  const KEY = 'guitarCoach.v1';
  const DEFAULT_STATE = Object.freeze({
    schemaVersion: 1,
    settings: Object.freeze({
      noiseFloorDb: null, gateOffsetDb: GuitarDSP.CONFIG.gateOffsetDb, a4: 440, inputDeviceId: null,
      recordSource: 'irig',
      monitor: Object.freeze({ on: false, gainDb: 0, toneDb: 0, volume: 0.5 })
    })
  });
  let cache = null;

  function isValid(d) {
    return d && typeof d === 'object' && d.schemaVersion === 1 && d.settings && typeof d.settings === 'object';
  }

  // Monitor always starts OFF (a speaker + built-in mic would howl).
  function mergeSettings(saved) {
    const monitor = Object.assign({}, DEFAULT_STATE.settings.monitor, saved.monitor || {}, { on: false });
    return Object.assign({}, DEFAULT_STATE.settings, saved, { monitor: monitor });
  }

  function load() {
    if (cache) return cache;
    try {
      const raw = localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      cache = isValid(parsed)
        ? Object.assign({}, DEFAULT_STATE, parsed, { settings: mergeSettings(parsed.settings) })
        : DEFAULT_STATE;
    } catch (e) {
      console.error('Could not read saved progress:', e);
      cache = DEFAULT_STATE;
    }
    return cache;
  }

  // fn(state) -> new state. Returns { ok, state }.
  // The in-memory copy only changes when the write succeeded, so the UI never shows data that is not saved.
  function update(fn) {
    const next = fn(load());
    try {
      localStorage.setItem(KEY, JSON.stringify(next));
      cache = next;
      return { ok: true, state: next };
    } catch (e) {
      console.error('Could not save progress:', e);
      return { ok: false, state: load() };
    }
  }

  function setSettings(patch) {
    return update(function (s) { return Object.assign({}, s, { settings: Object.assign({}, s.settings, patch) }); });
  }

  return { load: load, update: update, setSettings: setSettings };
})();

// Keeps the screen on while a screen that needs it is open. Re-acquires after tab switches.
const WakeLock = (function () {
  let sentinel = null, wanted = false;

    wanted = true;
    if (!('wakeLock' in navigator) || sentinel) return;
    try {
      sentinel = await navigator.wakeLock.request('screen');
      sentinel.addEventListener('release', function () { sentinel = null; });
    } catch (e) {
      console.warn('Wake lock unavailable:', e.message);
    }

    wanted = false;
    if (sentinel) sentinel.release().catch(function () {});
    sentinel = null;
  }

    if (document.visibilityState === 'visible' && wanted) acquire();
  });

    '  process(inputs) {',
    '    const chans = inputs[0];',

    '      let v = 0;',
    '      for (let c = 0; c < chans.length; c++) v += chans[c][i];',

    return tr && tr.getSettings ? tr.getSettings() : {};
  }

  function on(set, fn) { set.add(fn); return function () { set.delete(fn); }; }
  function onChunkInternal(fn) { return on(chunkListeners, fn); }

  return {
    start: start, stop: stop, running: running, selectInput: selectInput, listInputs: listInputs,
    sampleRate: function () { return ctx ? ctx.sampleRate : null; },
    onFrame: function (fn) { return on(frameListeners, fn); },
    onChunk: onChunkInternal,
    onState: function (fn) { return on(stateListeners, fn); },
    setAnalysis: function (o) { analysisOpts = Object.assign({}, analysisOpts, o); },
    setMonitor: setMonitor, applyMonitor: applyMonitor, measureRoundTrip: measureRoundTrip,
    info: function () {
      return {
        sampleRate: ctx && ctx.sampleRate, capture: captureKind, costMs: lastCostMs, settings: trackSettings(), gateDb: gateDb(),
        inputLabel: stream && stream.getAudioTracks()[0] ? stream.getAudioTracks()[0].label : '',
        baseLatencyMs: ctx && ctx.baseLatency ? ctx.baseLatency * 1000 : null,
        outputLatencyMs: ctx && ctx.outputLatency !== undefined ? ctx.outputLatency * 1000 : null
      };
    },
    gateDb: gateDb
  };
})();
</script>

<script id="app-ui">
'use strict';
const DSP = GuitarDSP;
const app = document.getElementById('app');

// ---------- helpers ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function $(root, sel) { return root.querySelector(sel); }
function fmtMs(s) { return s === null || s === undefined ? '-' : Math.round(s * 1000) + ' ms'; }
function median(xs) { const s = xs.slice().sort(function (a, b) { return a - b; }); return s[Math.floor(s.length / 2)]; }
const METER_FLOOR_DB = -60;
function dbToPct(db) { return Math.max(0, Math.min(100, (db - METER_FLOOR_DB) / -METER_FLOOR_DB * 100)); }
function prettyNote(name) { const m = /^([A-G]#?)(-?\d)$/.exec(name); return m ? esc(m[1]) + '<sub>' + m[2] + '</sub>' : esc(name); }

// Renders a "start microphone" gate; calls onReady once audio runs. Must start from a tap (iOS).
function micGate(root, onReady) {
  if (AudioEngine.running()) { onReady(); return; }
  root.innerHTML =
    '<div class="panel"><p>This screen listens through the microphone. Put the phone or laptop near the amp ' +
    '(about 50 cm), clean tone, neck pickup.</p><button class="primary block" id="micStart">Start microphone</button>' +
    '<p class="status err" id="micErr" hidden></p></div>';
  $(root, '#micStart').addEventListener('click', async function () {
    const btn = this, err = $(root, '#micErr');
    btn.disabled = true; btn.textContent = 'Starting...'; err.hidden = true;
    try {
      await AudioEngine.start();
      onReady();
    } catch (e) {
      console.error('Microphone start failed:', e);
      err.textContent = e.message; err.hidden = false;
      btn.disabled = false; btn.textContent = 'Try again';
    }
  });
}

// Confirm-tracking shared by debug view and later drills. Same onset rule as tests/stream.js.
// Latency is measured from the last onset (level jump, or signal crossing the gate) to confirmation.
function makeConfirmTracker(stableSec) {
  let state = DSP.initTracker(), lastOnset = null, prevDb = -120;
  return function step(label, frame, t) {
    const gate = AudioEngine.gateDb();
    const onset = DSP.isOnset(prevDb, frame.levelDb, gate);
    if (onset || (prevDb <= gate && frame.voiced)) lastOnset = t;
    prevDb = frame.levelDb;
    state = DSP.stepTracker(state, label, t, stableSec, onset);
    const latency = state.event === 'confirm' && lastOnset !== null && t - lastOnset < 3 ? t - lastOnset : null;
    return { state: state, latency: latency };
  };
}

// ---------- Tuner ----------
function TunerScreen() {
  let off = null, history = [], lastSeen = 0;
  function view(root) {
    root.innerHTML =
      '<div class="panel">' +
      '<div class="tuner-note" id="tNote">-</div>' +
      '<div class="tuner-cents muted" id="tCents">play one open string</div>' +
      '<div class="needle-wrap"><div class="needle-scale"></div><div class="needle-zone"></div>' +
      '<div class="needle" id="tNeedle"></div>' +
      '<div class="needle-labels"><span>-50</span><span>flat</span><span>0</span><span>sharp</span><span>+50</span></div></div>' +
      '<div class="strings" id="tStrings">' +
      DSP.STRINGS.map(function (s) { return '<div>' + esc(s.name.replace(/\d/, '')) + '</div>'; }).join('') + '</div>' +
      '<p class="small muted" id="tFreq">&nbsp;</p></div>' +
      '<p class="small muted">Green zone = within 5 cents. Pluck one string at a time and let it ring.</p>';
  }
  function onFrame(root, frame, t) {
    const p = frame.pitch;
    if (p && p.clarity > 0.85) {
      history = history.concat([p.freq]).slice(-5);
      lastSeen = t;
    } else if (t - lastSeen > 1) {
      history = [];
    }
    if (!history.length) { $(root, '#tNote').style.opacity = 0.35; return; }
    const f = median(history);
    const str = DSP.nearestString(f, Store.load().settings.a4);
    const note = DSP.freqToNote(f, Store.load().settings.a4);
    const cents = Math.max(-50, Math.min(50, str.cents));
    const inTune = Math.abs(str.cents) < 5;
    $(root, '#tNote').innerHTML = prettyNote(str.string.name);
    $(root, '#tNote').style.opacity = 1;
    $(root, '#tCents').textContent = Math.abs(str.cents) > 50
      ? (str.cents > 0 ? 'far too sharp - tune down' : 'far too flat - tune up')
      : (inTune ? 'in tune' : (str.cents > 0 ? 'sharp ' : 'flat ') + Math.abs(str.cents).toFixed(0) + ' cents - tune ' + (str.cents > 0 ? 'down' : 'up'));
    const needle = $(root, '#tNeedle');
    needle.style.left = (50 + cents) + '%';
    needle.className = 'needle' + (inTune ? ' in' : '');
    Array.prototype.forEach.call($(root, '#tStrings').children, function (el, i) {
      el.className = i === str.index ? (inTune ? 'tuned' : 'on') : '';
    });
    $(root, '#tFreq').textContent = f.toFixed(1) + ' Hz - heard ' + note.name + ' ' + (note.cents >= 0 ? '+' : '') + note.cents.toFixed(0) + ' c';
  }
  return {
    title: 'Tuner',
    mount: function (root) {
      micGate(root, function () {
        view(root);
        AudioEngine.setAnalysis({ pitch: true, chords: false });
        WakeLock.acquire();
        off = AudioEngine.onFrame(function (fr, t) { onFrame(root, fr, t); });
      });
    },
    leave: function () { if (off) off(); WakeLock.release(); }
  };
}

// ---------- Calibration + debug + recorder ----------
const REC_SECONDS = 3;

const REC_NOTES = (function () { const out = []; for (let m = 40; m <= 88; m++) out.push(DSP.noteName(m)); return out; })();

      '<div class="big-label" id="cChord">-</div></div>' +

      '<h2>7. Monitor (hear yourself)</h2><div class="panel">' +
      '<p class="small muted">Plays the input through a simple clean amp tone. Off by default. Use headphones or the iRig output: ' +
      'with a built-in mic and speaker it will howl. Detection always reads the dry input, never this sound. ' +

      '<button class="block" id="cMon">Monitor: OFF</button>' +
      '<p class="small">Gain <b id="cMonGainV">' + s.monitor.gainDb + '</b> dB</p>' +
      '<input type="range" min="-12" max="12" step="1" id="cMonGain" value="' + s.monitor.gainDb + '">' +
      '<p class="small">Tone (treble) <b id="cMonToneV">' + s.monitor.toneDb + '</b> dB</p>' +
      '<input type="range" min="-12" max="6" step="1" id="cMonTone" value="' + s.monitor.toneDb + '">' +
      '<p class="small">Volume <b id="cMonVolV">' + Math.round(s.monitor.volume * 100) + '</b>%</p>' +
      '<input type="range" min="0" max="1" step="0.05" id="cMonVol" value="' + s.monitor.volume + '">' +
      '</div>' +

      '<h2>8. Round-trip latency</h2><div class="panel">' +
      '<p class="small muted">Plays 6 clicks and times how long they take to come back in. Needs a loop: ' +
      'laptop/phone speaker near its own mic, or the iRig headphone output cabled back into its input (volume low!).</p>' +

    $(root, '#cMeasure').addEventListener('click', function () { startMeasure(root); });

  function wireInputs(root) {

      const cur = AudioEngine.info().settings.deviceId;

    sel.addEventListener('change', async function () {
      try {

        route();                                     // rebuild the screen on the new input
      } catch (e) {
        console.error('Input switch failed:', e);
        const p = document.createElement('p');
        p.className = 'status err';
        p.textContent = e.message;
        root.prepend(p);
      }
    });
  }

  function wireMonitor(root) {
    const btn = $(root, '#cMon');
    const paint = function () {
      const on = Store.load().settings.monitor.on;
      btn.textContent = 'Monitor: ' + (on ? 'ON' : 'OFF');
      btn.className = 'block' + (on ? ' ok' : '');
    };
    btn.addEventListener('click', function () { AudioEngine.setMonitor({ on: !Store.load().settings.monitor.on }); paint(); });
    [['#cMonGain', 'gainDb', '#cMonGainV', function (v) { return v; }],
     ['#cMonTone', 'toneDb', '#cMonToneV', function (v) { return v; }],
     ['#cMonVol', 'volume', '#cMonVolV', function (v) { return Math.round(v * 100); }]].forEach(function (c) {
      $(root, c[0]).addEventListener('input', function () {
        const v = Number(this.value), patch = {};
        patch[c[1]] = v;

        $(root, c[2]).textContent = c[3](v);
      });

    paint();
    $(root, '#cLat').addEventListener('click', function () { runLatencyTest(root, this); });
  }

  async function runLatencyTest(root, btn) {
    const out = $(root, '#cLatRes');
    btn.disabled = true;
    out.textContent = 'measuring... keep quiet';
    try {
      const r = await AudioEngine.measureRoundTrip(6);
      out.innerHTML = (r.detected
        ? 'round trip: median <b>' + r.medianMs.toFixed(1) + ' ms</b> (min ' + r.minMs.toFixed(1) + ', max ' + r.maxMs.toFixed(1) +
          ', ' + r.detected + '/' + r.sent + ' clicks heard)' + (r.exact ? '' : '<br>approximate (no AudioWorklet)')
        : 'no clicks heard back - is there a loop from output to input? (turn the volume up a little)') +
        '<br>browser reports: base ' + r.reported.baseMs.toFixed(1) + ' ms, output ' +
        (r.reported.outputMs === null ? 'n/a' : r.reported.outputMs.toFixed(1) + ' ms');
    } catch (e) {
      console.error('Latency test failed:', e);
      out.textContent = 'failed: ' + e.message;
    }
    btn.disabled = false;
  }

  function renderInfo(root) {
    const info = AudioEngine.info(), st = info.settings;

      ', output ' + (info.outputLatencyMs === null ? 'n/a' : info.outputLatencyMs.toFixed(1) + ' ms') + '<br>' +
      flag('echoCancellation') + '<br>' + flag('noiseSuppression') + '<br>' + flag('autoGainControl') + '<br>' +
      'analysis cost: <span id="cCost">-</span> ms per frame (budget ' + (DSP.CONFIG.hop / info.sampleRate * 1000).toFixed(0) + ' ms)<br>' +
      'screen wake lock: ' + (WakeLock.supported() ? 'supported' : 'not supported by this browser');
